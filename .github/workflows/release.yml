name: Caesura GA Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag; run this workflow from that same tag'
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve-tag:
    name: Require the selected existing tag to match this source
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag identity without creating or moving a tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v[0-9A-Za-z][0-9A-Za-z._+-]*', tag), 'Invalid explicit release tag'
          assert Path('.git').exists(), 'No source repository identity'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          target = subprocess.check_output(['git', 'rev-parse', '--verify', 'refs/tags/' + tag + '^{commit}'], text=True).strip()
          assert target == head == os.environ['SOURCE_SHA'], 'Run the release workflow from its existing tag'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('tag=' + tag + '\n')
          PY

  validate:
    name: Full CI and all final package gates
    needs: resolve-tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish-release:
    name: Publish the validated final package bytes
    needs: [resolve-tag, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact Windows package bundle
        uses: actions/download-artifact@v4
        with:
          name: caesura-amekag-windows-x64
          path: ${{ runner.temp }}/release-inputs/windows
      - name: Download exact Linux package bundle
        uses: actions/download-artifact@v4
        with:
          name: caesura-amekag-linux-x64
          path: ${{ runner.temp }}/release-inputs/linux
      - name: Download exact macOS package bundle
        uses: actions/download-artifact@v4
        with:
          name: caesura-amekag-macos-arm64
          path: ${{ runner.temp }}/release-inputs/macos
      - name: Download exact Web package bundle
        uses: actions/download-artifact@v4
        with:
          name: caesura-amekag-web
          path: ${{ runner.temp }}/release-inputs/web
      # These same-workflow manifest hashes bind transferred bytes. Hosted
      # artifact provenance and release authorization remain separate gates.
      - name: Verify producer manifests and collect only their final files
        id: collect
        env:
          SOURCE_SHA: ${{ github.sha }}
          WINDOWS_MANIFEST: ${{ needs.validate.outputs.windows_manifest_sha256 }}
          LINUX_MANIFEST: ${{ needs.validate.outputs.linux_manifest_sha256 }}
          MACOS_MANIFEST: ${{ needs.validate.outputs.macos_manifest_sha256 }}
          WEB_MANIFEST: ${{ needs.validate.outputs.web_manifest_sha256 }}
        run: |
          python3 scripts/ci_package_lane.py collect --source-sha "$SOURCE_SHA" \
            --work "$RUNNER_TEMP/caesura-release-final" \
            --bundle "$RUNNER_TEMP/release-inputs/windows" "$WINDOWS_MANIFEST" \
            --bundle "$RUNNER_TEMP/release-inputs/linux" "$LINUX_MANIFEST" \
            --bundle "$RUNNER_TEMP/release-inputs/macos" "$MACOS_MANIFEST" \
            --bundle "$RUNNER_TEMP/release-inputs/web" "$WEB_MANIFEST" \
            --github-output "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          files: ${{ steps.collect.outputs.upload_files }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
