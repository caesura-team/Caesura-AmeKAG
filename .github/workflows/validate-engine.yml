# Shared producers; hosted job names require exact API readback before candidate acceptance.
name: Validate engine producers
'on':
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      trigger_head_sha:
        required: true
        type: string
      source_mode:
        required: true
        type: string
      workflow_path:
        required: true
        type: string
      workflow_ref:
        required: true
        type: string
      workflow_sha:
        required: true
        type: string
      called_workflow_sha:
        required: true
        type: string
      policy_sha256:
        required: true
        type: string
      profile_sha256:
        required: true
        type: string
      engine_version:
        required: true
        type: string
      pull_request_number:
        required: false
        type: string
        default: ''
      called_workflow_path:
        required: false
        type: string
        default: .github/workflows/validate-engine.yml
      web_game:
        required: false
        type: string
        default: tests/projects/first_vn
      web_actions:
        required: false
        type: string
        default: ''
      web_actions_sha256:
        required: false
        type: string
        default: ''
    outputs:
      windows_debug_artifact_id:
        value: ${{ jobs.build-windows-debug.outputs.execution_artifact_id }}
      windows_debug_artifact_digest:
        value: ${{ jobs.build-windows-debug.outputs.execution_artifact_digest }}
      windows_debug_manifest_sha256:
        value: ${{ jobs.build-windows-debug.outputs.execution_manifest_sha256 }}
      windows_debug_receipt_sha256:
        value: ${{ jobs.build-windows-debug.outputs.execution_receipt_sha256 }}
      windows_debug_run_uuid:
        value: ${{ jobs.build-windows-debug.outputs.execution_run_uuid }}
      windows_release_artifact_id:
        value: ${{ jobs.release.outputs.execution_artifact_id }}
      windows_release_artifact_digest:
        value: ${{ jobs.release.outputs.execution_artifact_digest }}
      windows_release_manifest_sha256:
        value: ${{ jobs.release.outputs.execution_manifest_sha256 }}
      windows_release_receipt_sha256:
        value: ${{ jobs.release.outputs.execution_receipt_sha256 }}
      windows_release_run_uuid:
        value: ${{ jobs.release.outputs.execution_run_uuid }}
      linux_debug_artifact_id:
        value: ${{ jobs.build-linux.outputs.execution_artifact_id }}
      linux_debug_artifact_digest:
        value: ${{ jobs.build-linux.outputs.execution_artifact_digest }}
      linux_debug_manifest_sha256:
        value: ${{ jobs.build-linux.outputs.execution_manifest_sha256 }}
      linux_debug_receipt_sha256:
        value: ${{ jobs.build-linux.outputs.execution_receipt_sha256 }}
      linux_debug_run_uuid:
        value: ${{ jobs.build-linux.outputs.execution_run_uuid }}
      linux_release_artifact_id:
        value: ${{ jobs.release-linux.outputs.execution_artifact_id }}
      linux_release_artifact_digest:
        value: ${{ jobs.release-linux.outputs.execution_artifact_digest }}
      linux_release_manifest_sha256:
        value: ${{ jobs.release-linux.outputs.execution_manifest_sha256 }}
      linux_release_receipt_sha256:
        value: ${{ jobs.release-linux.outputs.execution_receipt_sha256 }}
      linux_release_run_uuid:
        value: ${{ jobs.release-linux.outputs.execution_run_uuid }}
      macos_debug_artifact_id:
        value: ${{ jobs.build-macos.outputs.execution_artifact_id }}
      macos_debug_artifact_digest:
        value: ${{ jobs.build-macos.outputs.execution_artifact_digest }}
      macos_debug_manifest_sha256:
        value: ${{ jobs.build-macos.outputs.execution_manifest_sha256 }}
      macos_debug_receipt_sha256:
        value: ${{ jobs.build-macos.outputs.execution_receipt_sha256 }}
      macos_debug_run_uuid:
        value: ${{ jobs.build-macos.outputs.execution_run_uuid }}
      macos_release_artifact_id:
        value: ${{ jobs.release-macos.outputs.execution_artifact_id }}
      macos_release_artifact_digest:
        value: ${{ jobs.release-macos.outputs.execution_artifact_digest }}
      macos_release_manifest_sha256:
        value: ${{ jobs.release-macos.outputs.execution_manifest_sha256 }}
      macos_release_receipt_sha256:
        value: ${{ jobs.release-macos.outputs.execution_receipt_sha256 }}
      macos_release_run_uuid:
        value: ${{ jobs.release-macos.outputs.execution_run_uuid }}
      windows_artifact_id:
        value: ${{ jobs.release.outputs.package_artifact_id }}
      windows_artifact_digest:
        value: ${{ jobs.release.outputs.package_artifact_digest }}
      windows_manifest_sha256:
        value: ${{ jobs.release.outputs.manifest_sha256 }}
      linux_artifact_id:
        value: ${{ jobs.release-linux.outputs.package_artifact_id }}
      linux_artifact_digest:
        value: ${{ jobs.release-linux.outputs.package_artifact_digest }}
      linux_manifest_sha256:
        value: ${{ jobs.release-linux.outputs.manifest_sha256 }}
      macos_artifact_id:
        value: ${{ jobs.release-macos.outputs.package_artifact_id }}
      macos_artifact_digest:
        value: ${{ jobs.release-macos.outputs.package_artifact_digest }}
      macos_manifest_sha256:
        value: ${{ jobs.release-macos.outputs.manifest_sha256 }}
      web_artifact_id:
        value: ${{ jobs.release-web.outputs.package_artifact_id }}
      web_artifact_digest:
        value: ${{ jobs.release-web.outputs.package_artifact_digest }}
      web_manifest_sha256:
        value: ${{ jobs.release-web.outputs.manifest_sha256 }}
      pages_artifact_id:
        value: ${{ jobs.release-web.outputs.pages_artifact_id }}
      pages_artifact_digest:
        value: ${{ jobs.release-web.outputs.pages_artifact_digest }}
      pages_manifest_sha256:
        value: ${{ jobs.release-web.outputs.manifest_sha256 }}
permissions:
  contents: read
  actions: read
env:
  BUILD_TYPE: Debug
  SOURCE_SHA: ${{ inputs.source_sha }}
  TRIGGER_HEAD_SHA: ${{ inputs.trigger_head_sha }}
  SOURCE_MODE: ${{ inputs.source_mode }}
  PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
  CALLER_WORKFLOW_PATH: ${{ inputs.workflow_path }}
  CALLER_WORKFLOW_REF: ${{ inputs.workflow_ref }}
  CALLER_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
  CALLED_WORKFLOW_PATH: ${{ inputs.called_workflow_path }}
  CALLED_WORKFLOW_SHA: ${{ inputs.called_workflow_sha }}
  POLICY_SHA256: ${{ inputs.policy_sha256 }}
  PROFILE_SHA256: ${{ inputs.profile_sha256 }}
  ENGINE_VERSION: ${{ inputs.engine_version }}
jobs:
  build-windows-debug:
    name: Windows · MSVC · Debug
    runs-on: windows-2022
    env:
      EXPECTED_RUNNER_ARCH: X64
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify explicit source, profile and caller identity
      id: source_guard
      shell: bash
      run: python scripts/ci_execution_lane.py guard
    - name: Choose fresh canonical evidence paths outside the checkout
      shell: python
      run: |
        import os
        from pathlib import Path
        base = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
        suffix = "-".join(os.environ[k] for k in ("GITHUB_JOB", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"))
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
            for key, name in (("EXECUTION_WORK", "u23-execution"), ("PACKAGE_WORK", "u23-package")):
                out.write(key + "=" + str(base / (name + "-" + suffix)) + "\n")
    - uses: actions/setup-node@v4
      with:
        node-version: 22.23.2
    - name: Install workflow test parser
      shell: bash
      run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
    - name: Install SDL3 (vcpkg)
      shell: pwsh
      run: |
        # vcpkg's recent bootstrap requires cmake >= 4.3.3, which the
        # hosted runner may lag; install a current cmake via pip first.
        python -m pip install --quiet --upgrade cmake
        $env:Path = "$env:LOCALAPPDATA\Programs\Python\Python312\Scripts;" + $env:Path
        vcpkg install sdl3 --triplet x64-windows
    - name: Configure
      shell: pwsh
      run: |
        cmake -B build -S . -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_APPLOCAL_DEPS=OFF -DCAESURA_REQUIRE_TEST_PREREQUISITES=ON
    - name: Copy SDL3 DLL
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "build/Debug" | Out-Null
        $sdlBin = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/x64-windows/bin/SDL3.dll"
        if (Test-Path $sdlBin) { Copy-Item $sdlBin "build/Debug/" }
    - name: Copy SDL3 DLL for tests
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "build/tests/Debug" | Out-Null
        $sdlBin = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/x64-windows/bin/SDL3.dll"
        if (Test-Path $sdlBin) { Copy-Item $sdlBin "build/tests/Debug/" }
    - name: Execute and strictly verify windows-debug once
      id: execution
      shell: pwsh
      run: |
        python scripts/ci_execution_lane.py run --profile-name windows-debug --configuration Debug --source-sha $env:SOURCE_SHA --profile-sha256 $env:PROFILE_SHA256 --build "$pwd/build" --work $env:EXECUTION_WORK --github-output $env:GITHUB_OUTPUT
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Recheck exact execution evidence before upload
      shell: pwsh
      env:
        LANE_RECEIPT: ${{ steps.execution.outputs.lane_receipt }}
        LANE_SHA256: ${{ steps.execution.outputs.lane_sha256 }}
      run: |
        python scripts/ci_execution_lane.py verify --receipt $env:LANE_RECEIPT --sha256 $env:LANE_SHA256
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Upload accepted windows-debug execution evidence
      id: execution_upload
      uses: actions/upload-artifact@v4
      with:
        name: u23-windows-debug-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.execution.outputs.bundle_dir }}
        if-no-files-found: error
    - name: Static contract check (.ks scenes)
      shell: pwsh
      run: |
        $lua = (Resolve-Path "build/lua/Debug/lua.exe").Path
        & $lua scripts/ks_check.lua demo/galgame_demo.ks demo/full_pipeline_demo.ks scripts/demo_story.ks
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Expo validation driver unit tests
      shell: pwsh
      run: |
        python -X utf8 scripts/eas/test_run_apple_validation.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Test coverage check (no orphan tests)
      shell: pwsh
      run: |
        # Regression guard (round 14): every test_*.lua / test_*.cpp must be
        # registered in its runner / CMakeLists — an unregistered test is a
        # silent green. Fails the job listing any orphan.
        python tests/scripts/check_test_coverage.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Generated docs freshness
      shell: pwsh
      run: |
        python scripts/api_stats.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $lua = (Resolve-Path "build/lua/Debug/lua.exe").Path
        python -c "import subprocess, sys; out = subprocess.check_output([sys.argv[1], 'scripts/schema_doc.lua'], encoding='utf-8'); open('docs/api/command-contracts.md', 'w', encoding='utf-8', newline='\n').write(out)" $lua
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git diff --exit-code docs/api/api-stats.md docs/api/command-contracts.md
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Generated docs are stale - run the generators locally and commit"
          exit 1
        }

    - name: Golden project static and headless contract
      shell: pwsh
      run: |
        $lua = (Resolve-Path "build/lua/Debug/lua.exe").Path
        & $lua scripts/ks_check.lua tests/projects/golden_vn/story.ks
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $env:SAMPLE_STORY = "tests/projects/golden_vn/story.ks"
        & $lua tests/scripts/sample_game_headless.lua
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Web scripts index freshness
      shell: pwsh
      run: |
        # Round 79 guard: deleting scripts/*.lua without regenerating
        # web/scripts-index.json breaks the web suite (ENOENT). Regenerate to
        # a temp file and diff against the committed artifact -- fails red
        # when stale/missing. Lightweight: node only, no wasmoon install.
        node web/gen-index.mjs --check
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Editor unit tests (vitest)
      shell: pwsh
      run: |
        # Editor front-end pure-logic tests (round 16): parseSceneElements
        # and future editor pure functions. node_modules is NOT checked in
        # (gitignored); npm ci installs from the lockfile deterministically.
        Push-Location editor
        npm ci --no-audit --no-fund
        npm test
        $code = $LASTEXITCODE
        Pop-Location
        if ($code -ne 0) { exit $code }
    - name: Web Player unit & integration tests (vitest)
      shell: pwsh
      run: |
        Push-Location web
        npm ci --no-audit --no-fund
        npm test
        $code = $LASTEXITCODE
        Pop-Location
        if ($code -ne 0) { exit $code }
    - name: Smoke Test
      shell: pwsh
      run: |
        $exe = "build/Debug/CaesuraAmeKAG.exe"
        if (Test-Path $exe) { Write-Host "Engine OK: $((Get-Item $exe).Length/1MB) MB" }
    - name: Web Packaging Unicode E2E
      shell: pwsh
      run: |
        # Round 32 (Track A): real engine + POST /api/package/web with a
        # Chinese story path and output name - CreateProcessW / widenUtf8
        # path-safety gate (tests/scripts/test_package_web_unicode.py).
        python tests/scripts/test_package_web_unicode.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python tests/scripts/test_package_game_node_cli.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $env:CAESURA_ENGINE = (Resolve-Path "build/Debug/CaesuraAmeKAG.exe").Path
        $env:CAESURA_LUA = (Resolve-Path "build/lua/Debug/lua.exe").Path
        $env:U21_TXN_EVIDENCE = "$pwd/artifacts/validation/package-transactions-ci"
        python tests/scripts/test_package_output_transactions.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $env:U21_TXN_EVIDENCE = "$pwd/artifacts/validation/asset-dependencies-ci"
        python tests/scripts/test_package_asset_dependencies.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Preserve Windows authoring evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-authoring-evidence
        path: |
          artifacts/validation/package-transactions-ci/
          artifacts/validation/asset-dependencies-ci/
        if-no-files-found: warn
    - name: Preserve Windows Debug runtime failure evidence
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: windows-debug-runtime-failure-evidence
        path: |
          build/Testing/Temporary/LastTest.log
          build/Debug/artifacts/validation/http-smoke-*/
        if-no-files-found: ignore
    - name: Preserve first windows-debug execution attempt
      if: always() && env.EXECUTION_WORK != ''
      uses: actions/upload-artifact@v4
      with:
        name: u23-windows-debug-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.EXECUTION_WORK }}/
        if-no-files-found: warn
    timeout-minutes: 90
    outputs:
      execution_artifact_id: ${{ steps.execution_upload.outputs.artifact-id }}
      execution_artifact_digest: ${{ steps.execution_upload.outputs.artifact-digest }}
      execution_manifest_sha256: ${{ steps.execution.outputs.manifest_sha256 }}
      execution_receipt_sha256: ${{ steps.execution.outputs.receipt_sha256 }}
      execution_run_uuid: ${{ steps.execution.outputs.run_uuid }}
  build-macos:
    name: macOS · Clang · Debug
    runs-on: macos-15
    env:
      EXPECTED_RUNNER_ARCH: ARM64
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify explicit source, profile and caller identity
      id: source_guard
      shell: bash
      run: python scripts/ci_execution_lane.py guard
    - name: Choose fresh canonical evidence paths outside the checkout
      shell: python
      run: |
        import os
        from pathlib import Path
        base = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
        suffix = "-".join(os.environ[k] for k in ("GITHUB_JOB", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"))
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
            for key, name in (("EXECUTION_WORK", "u23-execution"), ("PACKAGE_WORK", "u23-package")):
                out.write(key + "=" + str(base / (name + "-" + suffix)) + "\n")
    - name: Install workflow test parser
      shell: bash
      run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
    - uses: actions/setup-node@v4
      with:
        node-version: 22.23.2
    - name: Install Dependencies
      run: |
        brew install cmake sdl3 freetype zstd openssl@3 pkg-config lua
        python3 -m pip install --quiet pyyaml --break-system-packages 2>/dev/null || true
    - name: Configure
      run: |
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DCAESURA_ENABLE_FFMPEG=OFF -DBX_CONFIG_DEBUG=1 -DCMAKE_PREFIX_PATH="$(brew --prefix openssl@3)" -DCAESURA_REQUIRE_TEST_PREREQUISITES=ON
    - name: Execute and strictly verify macos-debug once
      id: execution
      shell: bash
      run: |
        python scripts/ci_execution_lane.py run --profile-name macos-debug --configuration Debug --source-sha "$SOURCE_SHA" --profile-sha256 "$PROFILE_SHA256" --build "$PWD/build" --work "$EXECUTION_WORK" --github-output "$GITHUB_OUTPUT"
    - name: Recheck exact execution evidence before upload
      shell: bash
      env:
        LANE_RECEIPT: ${{ steps.execution.outputs.lane_receipt }}
        LANE_SHA256: ${{ steps.execution.outputs.lane_sha256 }}
      run: |
        python scripts/ci_execution_lane.py verify --receipt "$LANE_RECEIPT" --sha256 "$LANE_SHA256"
    - name: Upload accepted macos-debug execution evidence
      id: execution_upload
      uses: actions/upload-artifact@v4
      with:
        name: u23-macos-debug-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.execution.outputs.bundle_dir }}
        if-no-files-found: error
    - name: Expo validation driver unit tests
      run: python3 scripts/eas/test_run_apple_validation.py
    - name: Golden project static and headless contract
      run: |
        "$PWD/build/lua/lua" scripts/ks_check.lua tests/projects/golden_vn/story.ks
        SAMPLE_STORY="tests/projects/golden_vn/story.ks" "$PWD/build/lua/lua" tests/scripts/sample_game_headless.lua
    - name: Web scripts index freshness
      run: |
        # Round 79 guard: deleting scripts/*.lua without regenerating
        # web/scripts-index.json breaks the web suite (ENOENT). Regenerate to
        # a temp file and diff against the committed artifact -- fails red
        # when stale/missing. Lightweight: node only, no wasmoon install.
        node web/gen-index.mjs --check
    - name: Preserve macOS RPC failure evidence
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: macos-rpc-failure-evidence
        path: |
          build/Testing/Temporary/LastTest.log
          ${{ runner.temp }}/caesura-native-observer/**/*.json
          build/artifacts/validation/rpc-timeouts-*/
          build/artifacts/validation/stdio-output-*/
          build/artifacts/validation/http-smoke-*/
        if-no-files-found: ignore
    - name: Preserve first macos-debug execution attempt
      if: always() && env.EXECUTION_WORK != ''
      uses: actions/upload-artifact@v4
      with:
        name: u23-macos-debug-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.EXECUTION_WORK }}/
        if-no-files-found: warn
    timeout-minutes: 90
    outputs:
      execution_artifact_id: ${{ steps.execution_upload.outputs.artifact-id }}
      execution_artifact_digest: ${{ steps.execution_upload.outputs.artifact-digest }}
      execution_manifest_sha256: ${{ steps.execution.outputs.manifest_sha256 }}
      execution_receipt_sha256: ${{ steps.execution.outputs.receipt_sha256 }}
      execution_run_uuid: ${{ steps.execution.outputs.run_uuid }}
  build-linux:
    name: Linux · GCC · Debug
    runs-on: ubuntu-24.04
    env:
      EXPECTED_RUNNER_ARCH: X64
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify explicit source, profile and caller identity
      id: source_guard
      shell: bash
      run: python scripts/ci_execution_lane.py guard
    - name: Choose fresh canonical evidence paths outside the checkout
      shell: python
      run: |
        import os
        from pathlib import Path
        base = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
        suffix = "-".join(os.environ[k] for k in ("GITHUB_JOB", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"))
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
            for key, name in (("EXECUTION_WORK", "u23-execution"), ("PACKAGE_WORK", "u23-package")):
                out.write(key + "=" + str(base / (name + "-" + suffix)) + "\n")
    - name: Install workflow test parser
      shell: bash
      run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
    - uses: actions/setup-node@v4
      with:
        node-version: 22.23.2
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential lua5.4 libfreetype-dev libzstd-dev libssl-dev libx11-dev libxrandr-dev libxext-dev libxfixes-dev libxi-dev libxcursor-dev libxinerama-dev libpulse-dev libasound2-dev libwayland-dev libdrm-dev libgbm-dev libibus-1.0-dev libudev-dev pkg-config wget python3-yaml xvfb libgl1 libegl1 libglx-mesa0 libgl1-mesa-dri
    - name: Configure ALSA null device (headless audio)
      run: |
        # SoLoud ALSA backend (enabled on Linux) needs a default PCM; CI
        # runners have no sound card. A null device lets init succeed and
        # keeps the audio path exercised instead of SIGABRT on snd_pcm.
        printf "pcm.!default { type null }\nctl.!default { type null }\n" | sudo tee /etc/asound.conf
    - name: Build SDL3 from source
      run: |
        wget -q https://github.com/libsdl-org/SDL/releases/download/release-3.2.0/SDL3-3.2.0.tar.gz
        tar xzf SDL3-3.2.0.tar.gz
        cd SDL3-3.2.0
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX=/usr/local
        cmake --build build --parallel $(nproc)
        sudo cmake --install build
        sudo ldconfig
        cd ..
        rm -rf SDL3-3.2.0 SDL3-3.2.0.tar.gz
    - name: Configure
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DCAESURA_ENABLE_FFMPEG=OFF -DBX_CONFIG_DEBUG=1 -DCAESURA_REQUIRE_TEST_PREREQUISITES=ON
    - name: Execute and strictly verify linux-debug once
      id: execution
      shell: bash
      run: |
        xvfb-run -a -s "-screen 0 1280x720x24" python scripts/ci_execution_lane.py run --profile-name linux-debug --configuration Debug --source-sha "$SOURCE_SHA" --profile-sha256 "$PROFILE_SHA256" --build "$PWD/build" --work "$EXECUTION_WORK" --github-output "$GITHUB_OUTPUT"
    - name: Recheck exact execution evidence before upload
      shell: bash
      env:
        LANE_RECEIPT: ${{ steps.execution.outputs.lane_receipt }}
        LANE_SHA256: ${{ steps.execution.outputs.lane_sha256 }}
      run: |
        python scripts/ci_execution_lane.py verify --receipt "$LANE_RECEIPT" --sha256 "$LANE_SHA256"
    - name: Upload accepted linux-debug execution evidence
      id: execution_upload
      uses: actions/upload-artifact@v4
      with:
        name: u23-linux-debug-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.execution.outputs.bundle_dir }}
        if-no-files-found: error
    - name: Bundled layout boot smoke (xvfb; A3/R6 contract)
      run: |
        sudo apt-get install -y xvfb libgl1 libegl1 libglx-mesa0 libgl1-mesa-dri
        xvfb-run -a -s "-screen 0 1280x720x24" bash scripts/verify_bundle_boot.sh build/CaesuraAmeKAG first_vn
        xvfb-run -a -s "-screen 0 1280x720x24" bash scripts/verify_bundle_boot.sh build/CaesuraAmeKAG demo
    - name: Golden project static and headless contract
      run: |
        "$PWD/build/lua/lua" scripts/ks_check.lua tests/projects/golden_vn/story.ks
        SAMPLE_STORY="tests/projects/golden_vn/story.ks" "$PWD/build/lua/lua" tests/scripts/sample_game_headless.lua
    - name: Web scripts index freshness
      run: |
        # Round 79 guard: deleting scripts/*.lua without regenerating
        # web/scripts-index.json breaks the web suite (ENOENT). Regenerate to
        # a temp file and diff against the committed artifact -- fails red
        # when stale/missing. Lightweight: node only, no wasmoon install.
        node web/gen-index.mjs --check
    - name: Web package hard gate (t144 design A)
      run: |
        # Bare checkout: cache/, web/dist/ and dist/ are all gitignored. Bake the
        # demo bundle first (web/vite.config.js closeBundle copies cache/story
        # unconditionally and ENOENTs without it), build the player, package
        # first_vn against it and assert the packaged tree. web/dist now exists,
        # so resources.test.js's dist cases run for real in the vitest step.
        lua5.4 scripts/ks_bake.lua --dir demo --web cache/story
        (cd web && npm ci --no-audit --no-fund && npm run build)
        bash scripts/package_game.sh --no-web-build tests/projects/first_vn
        bash scripts/verify_web_package.sh dist/first_vn
        python3 tests/scripts/test_package_game_node_cli.py
        CAESURA_ENGINE="$PWD/build/CaesuraAmeKAG" CAESURA_LUA="$PWD/build/lua/lua" \
          U21_TXN_EVIDENCE="$PWD/artifacts/validation/package-transactions-ci" \
          python3 tests/scripts/test_package_output_transactions.py
        CAESURA_ENGINE="$PWD/build/CaesuraAmeKAG" CAESURA_LUA="$PWD/build/lua/lua" \
          U21_TXN_EVIDENCE="$PWD/artifacts/validation/asset-dependencies-ci" \
          python3 tests/scripts/test_package_asset_dependencies.py
    - name: Preserve Linux authoring evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: linux-authoring-evidence
        path: |
          artifacts/validation/package-transactions-ci/
          artifacts/validation/asset-dependencies-ci/
        if-no-files-found: warn
    - name: Web Audio real PCM and lifecycle checks
      run: node scripts/web_audio_smoke.mjs --out artifacts/validation/web-audio-ci --browser chrome
    - name: Upload Web Audio evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: linux-web-audio-evidence
        path: artifacts/validation/web-audio-ci/report.json
        if-no-files-found: warn
    - name: Web Player unit & integration tests (vitest)
      run: |
        cd web
        npm test
        cd ..
    - name: Replay export real OpenGL CLI contract
      run: |
        xvfb-run -a -s "-screen 0 1280x720x24" python3 tests/scripts/test_replay_cli.py \
          --engine build/CaesuraAmeKAG --backend opengl --output artifacts/validation/replay-cli-ci
    - name: Preserve replay export evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: linux-replay-export-evidence
        path: |
          artifacts/validation/replay-cli-ci/result.json
          artifacts/validation/replay-cli-ci/source.json
          artifacts/validation/replay-cli-ci/*/process.json
          artifacts/validation/replay-cli-ci/*/stdout.log
          artifacts/validation/replay-cli-ci/*/stderr.log
          artifacts/validation/replay-cli-ci/*/game/frames/*.png
        if-no-files-found: warn
    - name: Upload ctest log on failure
      if: failure() && env.EXECUTION_WORK != ''
      uses: actions/upload-artifact@v4
      with:
        name: linux-ctest-log
        path: |
          ${{ env.EXECUTION_WORK }}/raw/ctest.stdout.log
          ${{ env.EXECUTION_WORK }}/raw/ctest.stderr.log
          build/Testing/Temporary/LastTest.log
          build/artifacts/validation/http-smoke-*/
        if-no-files-found: ignore
    - name: Coupling Count
      run: python3 scripts/count_coupling.py --ci
    - name: Test Coverage Check
      run: python3 tests/scripts/check_test_coverage.py
    - name: Platform Matrix Freshness & Validation
      run: python3 scripts/generate_platform_status.py --check
    - name: Platform Matrix Generator Unit Tests
      run: python3 tests/scripts/test_generate_platform_status.py
    - name: Plan Status Fact-Sync Check
      run: python3 scripts/generate_plan_status.py --check
    - name: Capability Closure Matrix Freshness
      run: |
        # Round 32 (Track B): closure matrix must match the current source
        # census. generated_at embeds the newest-input mtime by design, so
        # it differs across checkouts - normalize that line out of the diff
        # (git diff -I ignores hunks whose changed lines all match).
        python3 scripts/capability_closure.py
        if ! git diff -I "> 生成时间" --exit-code -- docs/design/capability-closure-matrix.md; then
          echo "Capability closure matrix is stale - run scripts/capability_closure.py and commit"
          exit 1
        fi
    - name: Android Subsystem Regression Gate
      run: python3 scripts/verify_android_regression.py
    - name: Preserve first linux-debug execution attempt
      if: always() && env.EXECUTION_WORK != ''
      uses: actions/upload-artifact@v4
      with:
        name: u23-linux-debug-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.EXECUTION_WORK }}/
        if-no-files-found: warn
    timeout-minutes: 90
    outputs:
      execution_artifact_id: ${{ steps.execution_upload.outputs.artifact-id }}
      execution_artifact_digest: ${{ steps.execution_upload.outputs.artifact-digest }}
      execution_manifest_sha256: ${{ steps.execution.outputs.manifest_sha256 }}
      execution_receipt_sha256: ${{ steps.execution.outputs.receipt_sha256 }}
      execution_run_uuid: ${{ steps.execution.outputs.run_uuid }}
  release:
    name: Windows · MSVC · Release and Package
    runs-on: windows-2022
    env:
      EXPECTED_RUNNER_ARCH: X64
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify explicit source, profile and caller identity
      id: source_guard
      shell: bash
      run: python scripts/ci_execution_lane.py guard
    - name: Choose fresh canonical evidence paths outside the checkout
      shell: python
      run: |
        import os
        from pathlib import Path
        base = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
        suffix = "-".join(os.environ[k] for k in ("GITHUB_JOB", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"))
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
            for key, name in (("EXECUTION_WORK", "u23-execution"), ("PACKAGE_WORK", "u23-package")):
                out.write(key + "=" + str(base / (name + "-" + suffix)) + "\n")
    - uses: actions/setup-node@v4
      with:
        node-version: 22.23.2
    - name: Install workflow test parser
      shell: bash
      run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
    - name: Install SDL3 (vcpkg)
      shell: pwsh
      run: |
        # vcpkg's recent bootstrap requires cmake >= 4.3.3, which the
        # hosted runner may lag; install a current cmake via pip first.
        python -m pip install --quiet --upgrade cmake
        $env:Path = "$env:LOCALAPPDATA\Programs\Python\Python312\Scripts;" + $env:Path
        vcpkg install sdl3 --triplet x64-windows
    - name: Configure
      shell: pwsh
      run: |
        cmake -B build -S . -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_APPLOCAL_DEPS=OFF -DCAESURA_REQUIRE_TEST_PREREQUISITES=ON
    - name: Copy SDL3 DLL
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "build/Release" | Out-Null
        $sdlBin = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/x64-windows/bin/SDL3.dll"
        if (Test-Path $sdlBin) { Copy-Item $sdlBin "build/Release/" }
    - name: Copy SDL3 DLL for tests
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "build/tests/Release" | Out-Null
        $sdlBin = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/x64-windows/bin/SDL3.dll"
        if (Test-Path $sdlBin) { Copy-Item $sdlBin "build/tests/Release/" }
    - name: Execute and strictly verify windows-release once
      id: execution
      shell: pwsh
      run: |
        python scripts/ci_execution_lane.py run --profile-name windows-release --configuration Release --source-sha $env:SOURCE_SHA --profile-sha256 $env:PROFILE_SHA256 --build "$pwd/build" --work $env:EXECUTION_WORK --github-output $env:GITHUB_OUTPUT
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Recheck exact execution evidence before upload
      shell: pwsh
      env:
        LANE_RECEIPT: ${{ steps.execution.outputs.lane_receipt }}
        LANE_SHA256: ${{ steps.execution.outputs.lane_sha256 }}
      run: |
        python scripts/ci_execution_lane.py verify --receipt $env:LANE_RECEIPT --sha256 $env:LANE_SHA256
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Upload accepted windows-release execution evidence
      id: execution_upload
      uses: actions/upload-artifact@v4
      with:
        name: u23-windows-release-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.execution.outputs.bundle_dir }}
        if-no-files-found: error
    - name: Static contract check (.ks scenes)
      shell: pwsh
      run: |
        $lua = (Resolve-Path "build/lua/Release/lua.exe").Path
        & $lua scripts/ks_check.lua demo/galgame_demo.ks demo/full_pipeline_demo.ks scripts/demo_story.ks
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Test coverage check (no orphan tests)
      shell: pwsh
      run: |
        # Regression guard (round 14): every test_*.lua / test_*.cpp must be
        # registered in its runner / CMakeLists — an unregistered test is a
        # silent green. Fails the job listing any orphan.
        python tests/scripts/check_test_coverage.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Generated docs freshness
      shell: pwsh
      run: |
        python scripts/api_stats.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $lua = (Resolve-Path "build/lua/Release/lua.exe").Path
        python -c "import subprocess, sys; out = subprocess.check_output([sys.argv[1], 'scripts/schema_doc.lua'], encoding='utf-8'); open('docs/api/command-contracts.md', 'w', encoding='utf-8', newline='\n').write(out)" $lua
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git diff --exit-code docs/api/api-stats.md docs/api/command-contracts.md
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Generated docs are stale - run the generators locally and commit"
          exit 1
        }

    - name: Golden project static and headless contract
      shell: pwsh
      run: |
        $lua = (Resolve-Path "build/lua/Release/lua.exe").Path
        & $lua scripts/ks_check.lua tests/projects/golden_vn/story.ks
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $env:SAMPLE_STORY = "tests/projects/golden_vn/story.ks"
        & $lua tests/scripts/sample_game_headless.lua
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Web scripts index freshness
      shell: pwsh
      run: |
        # Round 79 guard: deleting scripts/*.lua without regenerating
        # web/scripts-index.json breaks the web suite (ENOENT). Regenerate to
        # a temp file and diff against the committed artifact -- fails red
        # when stale/missing. Lightweight: node only, no wasmoon install.
        node web/gen-index.mjs --check
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Editor unit tests (vitest)
      shell: pwsh
      run: |
        # Editor front-end pure-logic tests (round 16): parseSceneElements
        # and future editor pure functions. node_modules is NOT checked in
        # (gitignored); npm ci installs from the lockfile deterministically.
        Push-Location editor
        npm ci --no-audit --no-fund
        npm test
        $code = $LASTEXITCODE
        Pop-Location
        if ($code -ne 0) { exit $code }
    - name: Web Player unit & integration tests (vitest)
      shell: pwsh
      run: |
        Push-Location web
        npm ci --no-audit --no-fund
        npm test
        $code = $LASTEXITCODE
        Pop-Location
        if ($code -ne 0) { exit $code }
    - name: Build editor IDE (editor/dist ships in the package)
      shell: pwsh
      run: |
        cd editor
        npm ci --no-audit --no-fund
        npm run build
    - name: Validate final Windows ZIP outside the checkout
      id: package
      shell: pwsh
      run: |
        $python = (Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
        $cpack = (Get-Command cpack -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
        & $python scripts/ci_package_lane.py native --platform windows --audio-output software --source-sha $env:SOURCE_SHA --work $env:PACKAGE_WORK --build "$pwd/build" --requirements "$pwd/build/package-requirements-Release.json" --python $python --cpack $cpack --github-output $env:GITHUB_OUTPUT
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Recheck accepted bytes immediately before upload
      env:
        RECEIPT: ${{ steps.package.outputs.receipt }}
        RECEIPT_SHA256: ${{ steps.package.outputs.receipt_sha256 }}
      shell: pwsh
      run: |
        python scripts/ci_package_lane.py verify --receipt $env:RECEIPT --sha256 $env:RECEIPT_SHA256
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Upload only accepted final packages and their manifest
      uses: actions/upload-artifact@v4
      with:
        name: caesura-amekag-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.package.outputs.upload_files }}
        if-no-files-found: error
      id: package_upload
    - name: Preserve first package attempt evidence
      if: always() && env.PACKAGE_WORK != ''
      uses: actions/upload-artifact@v4
      with:
        name: u22-windows-package-evidence
        path: |
          ${{ env.PACKAGE_WORK }}/**/*.json
          ${{ env.PACKAGE_WORK }}/**/*.log
          ${{ env.PACKAGE_WORK }}/**/*.png
        if-no-files-found: warn
    - name: Preserve Windows Release runtime failure evidence
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: windows-release-runtime-failure-evidence
        path: |
          build/Testing/Temporary/LastTest.log
          build/Release/artifacts/validation/http-smoke-*/
        if-no-files-found: ignore
    - name: Preserve first windows-release execution attempt
      if: always() && env.EXECUTION_WORK != ''
      uses: actions/upload-artifact@v4
      with:
        name: u23-windows-release-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.EXECUTION_WORK }}/
        if-no-files-found: warn
    needs: build-windows-debug
    timeout-minutes: 90
    outputs:
      execution_artifact_id: ${{ steps.execution_upload.outputs.artifact-id }}
      execution_artifact_digest: ${{ steps.execution_upload.outputs.artifact-digest }}
      execution_manifest_sha256: ${{ steps.execution.outputs.manifest_sha256 }}
      execution_receipt_sha256: ${{ steps.execution.outputs.receipt_sha256 }}
      execution_run_uuid: ${{ steps.execution.outputs.run_uuid }}
      package_artifact_id: ${{ steps.package_upload.outputs.artifact-id }}
      package_artifact_digest: ${{ steps.package_upload.outputs.artifact-digest }}
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}
  release-linux:
    name: Linux · GCC · Release and Package
    runs-on: ubuntu-24.04
    env:
      EXPECTED_RUNNER_ARCH: X64
    timeout-minutes: 90
    needs: build-linux
