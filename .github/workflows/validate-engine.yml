      execution_receipt_sha256: ${{ steps.execution.outputs.receipt_sha256 }}
      execution_run_uuid: ${{ steps.execution.outputs.run_uuid }}
      package_artifact_id: ${{ steps.package_upload.outputs.artifact-id }}
      package_artifact_digest: ${{ steps.package_upload.outputs.artifact-digest }}
    steps:
    - uses: actions/checkout@v4
      with:
