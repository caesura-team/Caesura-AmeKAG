      with:
        name: linux-release-runtime-failure-evidence
        path: |
          build/Testing/Temporary/LastTest.log
          build/artifacts/validation/http-smoke-*/
        if-no-files-found: ignore
    - name: Preserve first linux-release execution attempt
      if: always() && env.EXECUTION_WORK != ''
      uses: actions/upload-artifact@v4
      with:
        name: u23-linux-release-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.EXECUTION_WORK }}/
        if-no-files-found: warn
  release-macos:
    name: macOS · Clang · Release and Package
    runs-on: macos-15
    env:
      EXPECTED_RUNNER_ARCH: ARM64
    timeout-minutes: 90
    needs: build-macos
    outputs:
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}
      execution_artifact_id: ${{ steps.execution_upload.outputs.artifact-id }}
      execution_artifact_digest: ${{ steps.execution_upload.outputs.artifact-digest }}
      execution_manifest_sha256: ${{ steps.execution.outputs.manifest_sha256 }}
      execution_receipt_sha256: ${{ steps.execution.outputs.receipt_sha256 }}
      execution_run_uuid: ${{ steps.execution.outputs.run_uuid }}
      package_artifact_id: ${{ steps.package_upload.outputs.artifact-id }}
      package_artifact_digest: ${{ steps.package_upload.outputs.artifact-digest }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify explicit source, profile and caller identity
      id: source_guard
      shell: bash
      run: python scripts/ci_execution_lane.py guard
    - name: Choose fresh canonical evidence paths outside the checkout
      shell: python
      run: |
        import os
        from pathlib import Path
        base = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
        suffix = "-".join(os.environ[k] for k in ("GITHUB_JOB", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"))
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
            for key, name in (("EXECUTION_WORK", "u23-execution"), ("PACKAGE_WORK", "u23-package")):
                out.write(key + "=" + str(base / (name + "-" + suffix)) + "\n")
    - name: Install workflow test parser
      shell: bash
      run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
    - uses: actions/setup-node@v4
      with:
        node-version: 22.23.2
    - name: Install Dependencies
      run: brew install cmake freetype zstd openssl@3 pkg-config
    - name: Build SDL3 from source
      run: |
        curl -fsSL -o SDL3-3.2.0.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-3.2.0/SDL3-3.2.0.tar.gz
        tar xzf SDL3-3.2.0.tar.gz
        cd SDL3-3.2.0
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3-mac"
        cmake --build build --parallel $(sysctl -n hw.logicalcpu)
        cmake --install build
        cd ..
        rm -rf SDL3-3.2.0 SDL3-3.2.0.tar.gz
    - name: Configure Release
      env:
        SDL3_DIR: ${{ runner.temp }}/sdl3-mac/lib/cmake/SDL3
      run: |
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCAESURA_ENABLE_FFMPEG=OFF -DCMAKE_PREFIX_PATH="$(brew --prefix openssl@3)" -DCAESURA_REQUIRE_TEST_PREREQUISITES=ON
    - name: Execute and strictly verify macos-release once
      id: execution
      shell: bash
      run: |
        python scripts/ci_execution_lane.py run --profile-name macos-release --configuration Release --source-sha "$SOURCE_SHA" --profile-sha256 "$PROFILE_SHA256" --build "$PWD/build" --work "$EXECUTION_WORK" --github-output "$GITHUB_OUTPUT"
    - name: Recheck exact execution evidence before upload
      shell: bash
      env:
        LANE_RECEIPT: ${{ steps.execution.outputs.lane_receipt }}
        LANE_SHA256: ${{ steps.execution.outputs.lane_sha256 }}
      run: |
        python scripts/ci_execution_lane.py verify --receipt "$LANE_RECEIPT" --sha256 "$LANE_SHA256"
    - name: Upload accepted macos-release execution evidence
      id: execution_upload
      uses: actions/upload-artifact@v4
      with:
        name: u23-macos-release-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.execution.outputs.bundle_dir }}
        if-no-files-found: error
    - name: SDL3 link evidence (otool)
      run: otool -L build/CaesuraAmeKAG | grep -i sdl3 || true
    - name: Build editor IDE (editor/dist ships in the package)
      run: |
        cd editor
        npm ci --no-audit --no-fund
        npm run build
    - name: Validate final macOS TGZ and DMG outside the checkout
      id: package
      run: |
        python3 scripts/ci_package_lane.py native \
          --platform macos --audio-output software --source-sha "$SOURCE_SHA" --work "$PACKAGE_WORK" \
          --build "$PWD/build" --requirements "$PWD/build/package-requirements-Release.json" \
          --python "$(command -v python3)" --cpack "$(command -v cpack)" --hdiutil /usr/bin/hdiutil \
          --github-output "$GITHUB_OUTPUT"
    - name: Recheck accepted bytes immediately before upload
      env:
        RECEIPT: ${{ steps.package.outputs.receipt }}
        RECEIPT_SHA256: ${{ steps.package.outputs.receipt_sha256 }}
      run: python3 scripts/ci_package_lane.py verify --receipt "$RECEIPT" --sha256 "$RECEIPT_SHA256"
    - name: Upload only accepted final packages and their manifest
      uses: actions/upload-artifact@v4
      with:
        name: caesura-amekag-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.package.outputs.upload_files }}
        if-no-files-found: error
      id: package_upload
    - name: Preserve Apple tool identity and version diagnostics
      if: always()
      continue-on-error: true
      run: |
        python3 -B - <<'PY'
        import hashlib, json, os, sys
        from datetime import datetime, timezone
        from pathlib import Path
        root = Path.cwd().resolve()
        sys.path.insert(0, str(root / 'scripts'))
        from package_runtime import run_runtime_command
        output = root / 'build-macos-install-reports' / 'apple-tool-diagnostics'
        output.mkdir(parents=True, exist_ok=False)
        report = {'schema': 1, 'status': 'DIAGNOSTIC_ONLY', 'commands': [],
                  'started_utc': datetime.now(timezone.utc).isoformat(),
                  'scope': 'Raw version-option results and tool identities; unsupported options are retained, never package acceptance.'}
        environment = {'PATH': '/usr/bin:/bin:/usr/sbin:/sbin', 'HOME': str(Path.home()),
                       'TMPDIR': os.environ.get('RUNNER_TEMP', '/tmp'), 'LANG': 'C', 'LC_ALL': 'C'}
        def identity(path):
            resolved = path.resolve(strict=True)
            with resolved.open('rb') as stream:
                sha = hashlib.file_digest(stream, 'sha256').hexdigest()
            return {'path': str(resolved), 'sha256': sha, 'size': resolved.stat().st_size}
        for name, option in (('install_name_tool', '-version'), ('codesign', '--version'), ('xcodebuild', '-version')):
            executable = Path('/usr/bin') / name
            item = {'argv': [str(executable), option], 'status': 'NOT_RUN'}
            report['commands'].append(item)
            control = output / (name + '.owned')
            try:
                item['image_before'] = identity(executable)
                with (output / (name + '.stdout')).open('xb') as stdout, (output / (name + '.stderr')).open('xb') as stderr:
                    item['runtime'] = run_runtime_command(item['argv'], root, environment, control, stdout, stderr, 20)
                item['status'] = 'RESULT_RECORDED'
            except Exception as error:
                item['status'] = 'UNAVAILABLE_OR_FAILED'
                item['error'] = f'{type(error).__name__}: {error}'
                if (control / 'run.json').is_file():
                    item['runtime'] = json.loads((control / 'run.json').read_text(encoding='utf-8'))
            finally:
                try:
                    item['image_after'] = identity(executable)
                except Exception as error:
                    item['image_after_error'] = f'{type(error).__name__}: {error}'
                (output / 'report.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
        report['finished_utc'] = datetime.now(timezone.utc).isoformat()
        (output / 'report.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
        print(json.dumps({'status': 'DIAGNOSTIC_ONLY', 'report': str(output / 'report.json')}))
        PY

    - name: Preserve first package attempt evidence
      if: always() && env.PACKAGE_WORK != ''
      uses: actions/upload-artifact@v4
      with:
        name: u22-macos-package-evidence
        path: |
          build/release-build.log
          build/openssl-selection-*.json
          build/package-requirements-*.json
          build-macos-install-reports/
          ${{ env.PACKAGE_WORK }}/**/*.json
          ${{ env.PACKAGE_WORK }}/**/*.log
          ${{ env.PACKAGE_WORK }}/**/*.png
        if-no-files-found: warn
    - name: Preserve macOS Release runtime failure evidence
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: macos-release-runtime-failure-evidence
        path: |
          build/Testing/Temporary/LastTest.log
          ${{ runner.temp }}/caesura-native-observer/**/*.json
          build/artifacts/validation/http-smoke-*/
        if-no-files-found: ignore
    - name: Preserve first macos-release execution attempt
      if: always() && env.EXECUTION_WORK != ''
      uses: actions/upload-artifact@v4
      with:
        name: u23-macos-release-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.EXECUTION_WORK }}/
        if-no-files-found: warn
  release-web:
    name: Web · Final Package
    runs-on: ubuntu-24.04
    env:
      EXPECTED_RUNNER_ARCH: X64
    needs: build-linux
    timeout-minutes: 20
    outputs:
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}
      package_artifact_id: ${{ steps.package_upload.outputs.artifact-id }}
      package_artifact_digest: ${{ steps.package_upload.outputs.artifact-digest }}
      pages_artifact_id: ${{ steps.pages_upload.outputs.artifact-id }}
      pages_artifact_digest: ${{ steps.pages_upload.outputs.artifact-digest }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        ref: ${{ inputs.source_sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify explicit source, profile and caller identity
      id: source_guard
      shell: bash
      run: python scripts/ci_execution_lane.py guard
    - name: Choose fresh canonical evidence paths outside the checkout
      shell: python
      run: |
        import os
        from pathlib import Path
        base = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
        suffix = "-".join(os.environ[k] for k in ("GITHUB_JOB", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"))
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
            for key, name in (("EXECUTION_WORK", "u23-execution"), ("PACKAGE_WORK", "u23-package")):
                out.write(key + "=" + str(base / (name + "-" + suffix)) + "\n")
    - uses: actions/setup-node@v4
      with:
        node-version: 22.23.2
        cache: npm
        cache-dependency-path: web/package-lock.json
    - name: Install Web dependencies and Lua
      run: |
        sudo apt-get update
        sudo apt-get install -y lua5.4
        npm ci --prefix web --no-audit --no-fund
    - name: Require current tracked script index
      run: node web/gen-index.mjs --check
    - name: Install the pinned browser for offline package validation
      # Chrome 152 loses the navigator network override on renderer reload.
      # Keep the strict offline assertions and select a reproducible stable
      # browser with the persisted override, instead of the runner image copy.
      run: |
        chrome_root="$RUNNER_TEMP/u22-chrome-153.0.8010.52"
        mkdir "$chrome_root"
        curl --fail --location --max-time 180 \
          https://storage.googleapis.com/chrome-for-testing-public/153.0.8010.52/linux64/chrome-linux64.zip \
          --output "$chrome_root/chrome.zip"
        printf '%s  %s\n' e66f66d4802a46d4a022667e668aa950e277cadbfbed4b3777915b47413a0ef9 "$chrome_root/chrome.zip" | sha256sum --check --strict
        install_root=/usr/lib/caesura-u22-chrome-153.0.8010.52
        export CHROME_BINARY="$install_root/chrome-linux64/chrome"
        # Chrome 153 discovers the sibling chrome-sandbox before consulting
        # environment overrides. Keep the OS sandbox enabled and install the
        # pinned helper with its required root ownership and setuid mode.
        python3 - <<'PY'
        import json, os, pathlib, stat
        target = pathlib.Path(os.environ['CHROME_BINARY']).parents[1]
        evidence = {'status': 'FAIL', 'target': str(target), 'runner_uid': os.geteuid(),
                    'installation_parents': [], 'sandbox_runtime': 'NOT_VERIFIED'}
        try:
            if os.geteuid() == 0:
                raise ValueError('Browser validation must run as the unprivileged runner')
            for parent in reversed(target.parents):
                info = parent.lstat()
                row = {'path': str(parent), 'uid': info.st_uid, 'gid': info.st_gid,
                       'mode': oct(stat.S_IMODE(info.st_mode)),
                       'runner_writable': os.access(parent, os.W_OK)}
                evidence['installation_parents'].append(row)
                if (not stat.S_ISDIR(info.st_mode) or info.st_uid != 0 or info.st_gid != 0 or
                        info.st_mode & 0o022 or row['runner_writable']):
                    raise ValueError(f'Unsafe browser installation parent: {row}')
            if os.path.lexists(target):
                raise ValueError(f'Browser installation target already exists: {target}')
            evidence['status'] = 'PASS'
        except (OSError, ValueError) as error:
            evidence['error'] = str(error)
            raise
        finally:
            output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'u22-chrome-153.0.8010.52' / 'preflight.json'
            output.write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')
            print(json.dumps(evidence))
        PY
        sudo -n mkdir --mode=0755 -- "$install_root"
        # Verify an immutable-to-runner archive copy before privileged unzip.
        sudo -n install --owner=root --group=root --mode=0644 -- "$chrome_root/chrome.zip" "$install_root/chrome.zip"
        printf '%s  %s\n' e66f66d4802a46d4a022667e668aa950e277cadbfbed4b3777915b47413a0ef9 "$install_root/chrome.zip" | sha256sum --check --strict
        sudo -n unzip -q "$install_root/chrome.zip" -d "$install_root"
        printf '%s  %s\n' \
          328fbee82d8e58b05a755b2343abfd192d92ca7066353cb357fad389bc7e3989 "$CHROME_BINARY" \
          c100b678a8c171ad0733e51b6f18d98d936d38ab945681c41da00f2ee22e7571 "$install_root/chrome-linux64/chrome_sandbox" \
          | sha256sum --check --strict
        test ! -e "$install_root/chrome-linux64/chrome-sandbox"
        test ! -L "$install_root/chrome-linux64/chrome-sandbox"
        sudo -n install --owner=root --group=root --mode=4755 -- "$install_root/chrome-linux64/chrome_sandbox" "$install_root/chrome-linux64/chrome-sandbox"
        sudo -n rm -- "$install_root/chrome.zip"
        python3 - <<'PY'
        import hashlib, json, os, pathlib, stat, subprocess, sys
        binary = pathlib.Path(os.environ['CHROME_BINARY'])
        helper = binary.with_name('chrome-sandbox')
        install_root = binary.parents[1]
        root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'u22-chrome-153.0.8010.52'
        code, stdout, stderr = None, b'', b''
        evidence = {'status': 'FAIL', 'path': str(binary), 'sha256': None,
                    'archive_sha256': 'e66f66d4802a46d4a022667e668aa950e277cadbfbed4b3777915b47413a0ef9',
                    'sandbox_runtime': 'NOT_VERIFIED', 'installation_parents': []}
        def identity(path, directory=False, expected_mode=None, expected_sha256=None):
            info = path.lstat()
            mode = stat.S_IMODE(info.st_mode)
            if ((not stat.S_ISDIR(info.st_mode) if directory else not stat.S_ISREG(info.st_mode)) or
                    info.st_uid != 0 or info.st_gid != 0 or mode & 0o022 or os.access(path, os.W_OK) or
                    (not directory and info.st_nlink != 1) or
                    (mode & 0o7000 and path != helper) or
                    (expected_mode is not None and mode != expected_mode)):
                raise ValueError(f'Unsafe installed browser identity: {path}')
            result = {'path': str(path), 'uid': info.st_uid, 'gid': info.st_gid,
                      'mode': oct(mode), 'links': info.st_nlink, 'runner_writable': False}
            if expected_sha256 is not None:
                result['sha256'] = hashlib.sha256(path.read_bytes()).hexdigest()
                if result['sha256'] != expected_sha256:
                    raise ValueError(f'Installed browser digest differs: {path}')
            return result
        try:
            if os.geteuid() == 0:
                raise ValueError('Browser validation must run as the unprivileged runner')
            for parent in [*reversed(install_root.parents), install_root, binary.parent]:
                evidence['installation_parents'].append(identity(parent, directory=True))
            entries = 0
            def traversal_error(error):
                raise error
            for current, directories, files in os.walk(install_root, followlinks=False, onerror=traversal_error):
                for name in directories:
                    identity(pathlib.Path(current) / name, directory=True)
                for name in files:
                    identity(pathlib.Path(current) / name)
                entries += len(directories) + len(files)
            evidence['tree_entries_checked'] = entries
            evidence['binary_identity'] = identity(binary, expected_mode=0o755,
                expected_sha256='328fbee82d8e58b05a755b2343abfd192d92ca7066353cb357fad389bc7e3989')
            evidence['sha256'] = evidence['binary_identity']['sha256']
            evidence['helper'] = identity(helper, expected_mode=0o4755,
                expected_sha256='c100b678a8c171ad0733e51b6f18d98d936d38ab945681c41da00f2ee22e7571')
            if not os.access(binary, os.X_OK) or not os.access(helper, os.X_OK):
                raise ValueError('Installed browser and sandbox helper must be executable by the runner')
            result = subprocess.run([str(binary), '--version'], capture_output=True, timeout=20)
            code, stdout, stderr = result.returncode, result.stdout, result.stderr
        except subprocess.TimeoutExpired as error:
            code, stdout, stderr = None, error.stdout or b'', error.stderr or b''
            stderr += b'\nBrowser version command exceeded 20 seconds.\n'
        except (OSError, ValueError) as error:
            code, stdout, stderr = None, b'', str(error).encode('utf-8')
        root.joinpath('version.stdout.log').write_bytes(stdout)
        root.joinpath('version.stderr.log').write_bytes(stderr)
        version = stdout.decode('utf-8', errors='replace').strip()
        accepted = code == 0 and version.split()[-1:] == ['153.0.8010.52']
        evidence.update(status='PASS' if accepted else 'FAIL', exit_code=code, version=version)
        root.joinpath('selection.json').write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')
        print(json.dumps(evidence))
        sys.stderr.write(stderr.decode('utf-8', errors='replace'))
        if not accepted:
            raise SystemExit(1)
        PY
        echo "CHROME_BINARY=$CHROME_BINARY" >> "$GITHUB_ENV"
    - name: Build chosen game and validate final directory, ZIP and Pages tar
      id: package
      run: |
        args=()
        if [ -n "$WEB_ACTIONS" ]; then args+=(--actions "$WEB_ACTIONS" --actions-sha256 "$WEB_ACTIONS_SHA256"); fi
        python scripts/ci_package_lane.py web --source-sha "$SOURCE_SHA" --work "$PACKAGE_WORK" \
          --game "$WEB_GAME" --zip-name "CaesuraAmeKAG-${ENGINE_VERSION}-Web.zip" --pages-tar \
          --node "$(command -v node)" --lua "$(command -v lua5.4)" \
          --browser "$CHROME_BINARY" "${args[@]}" --github-output "$GITHUB_OUTPUT"
      env:
        WEB_GAME: ${{ inputs.web_game }}
        WEB_ACTIONS: ${{ inputs.web_actions }}
        WEB_ACTIONS_SHA256: ${{ inputs.web_actions_sha256 }}
    - name: Recheck accepted bytes immediately before upload
      env:
        RECEIPT: ${{ steps.package.outputs.receipt }}
        RECEIPT_SHA256: ${{ steps.package.outputs.receipt_sha256 }}
      run: python3 scripts/ci_package_lane.py verify --receipt "$RECEIPT" --sha256 "$RECEIPT_SHA256"
    - name: Upload accepted Web and Pages proof bundle
      uses: actions/upload-artifact@v4
      with:
        name: caesura-amekag-web-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.package.outputs.upload_files }}
        if-no-files-found: error
      id: package_upload
    - name: Recheck the original final tar immediately before Pages artifact upload
      env:
        RECEIPT: ${{ steps.package.outputs.receipt }}
        RECEIPT_SHA256: ${{ steps.package.outputs.receipt_sha256 }}
      run: python3 scripts/ci_package_lane.py verify --receipt "$RECEIPT" --sha256 "$RECEIPT_SHA256"
    # upload-pages-artifact would rebuild the tar after acceptance. Transfer
    # this exact single tar with upload-artifact and retain its independent ID.
    - name: Upload the exact accepted Pages tar without rebuilding it
      id: pages_upload
      uses: actions/upload-artifact@v4
      with:
        name: caesura-pages-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.package.outputs.pages_file }}
        if-no-files-found: error
        compression-level: 0
    - name: Preserve first Web package attempt evidence
      if: always() && env.PACKAGE_WORK != ''
      uses: actions/upload-artifact@v4
      with:
        name: u22-web-package-evidence
        path: |
          ${{ runner.temp }}/u22-chrome-153.0.8010.52/selection.json
          ${{ runner.temp }}/u22-chrome-153.0.8010.52/preflight.json
          ${{ runner.temp }}/u22-chrome-153.0.8010.52/version.*.log
          ${{ env.PACKAGE_WORK }}/**/*.json
          ${{ env.PACKAGE_WORK }}/**/*.jsonl
          ${{ env.PACKAGE_WORK }}/**/*.log
          ${{ env.PACKAGE_WORK }}/**/*.png
        if-no-files-found: warn
