name: CI
'on':
  push:
    branches:
    - master
    - main
  pull_request:
    branches:
    - master
    - main
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    name: Lock source and candidate policy
    runs-on: ubuntu-24.04
    outputs:
      policy_json: ${{ steps.policy.outputs.policy_json }}
      policy_sha256: ${{ steps.policy.outputs.policy_sha256 }}
      profile_sha256: ${{ steps.policy.outputs.profile_sha256 }}
      version: ${{ steps.policy.outputs.version }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      expected_json: ${{ steps.identity.outputs.expected_json }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
        submodules: recursive
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify the explicit execution head
      id: identity
      env:
        SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        python - <<'PY'
        import json, os, re, subprocess
        from pathlib import Path
        assert Path('.git').exists(), 'Missing Git checkout'
        source = os.environ['SOURCE_SHA']
        assert re.fullmatch('[0-9a-f]{40}', source), 'Full source SHA required'
        assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == source, 'Wrong checkout'
        expected = dict(schema_version=1, repository=os.environ['GITHUB_REPOSITORY'],
            repository_id=int(os.environ['GITHUB_REPOSITORY_ID']), source_sha=source, trigger_head_sha=source,
            run_id=int(os.environ['GITHUB_RUN_ID']), run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
            source_mode='head', workflow_path='.github/workflows/ci.yml',
            workflow_ref=os.environ['GITHUB_WORKFLOW_REF'], workflow_sha=os.environ['GITHUB_WORKFLOW_SHA'],
            called_workflow_path='.github/workflows/validate-engine.yml', called_workflow_sha=os.environ['GITHUB_WORKFLOW_SHA'])
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
            output.write('source_sha=' + source + '\n')
            output.write('expected_json=' + json.dumps(expected, separators=(',', ':')) + '\n')
        PY
    - name: Freeze the source policy before producer fanout
      id: policy
      env:
        SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
      run: python scripts/prepare_release_policy.py --repo . --output "$RUNNER_TEMP/release-policy.json" --github-output "$GITHUB_OUTPUT"
  validate:
    name: Validate engine
    needs:
    - prepare
    uses: ./.github/workflows/validate-engine.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      trigger_head_sha: ${{ needs.prepare.outputs.source_sha }}
      source_mode: head
      workflow_path: .github/workflows/ci.yml
      workflow_ref: ${{ github.workflow_ref }}
      workflow_sha: ${{ github.workflow_sha }}
      called_workflow_sha: ${{ github.workflow_sha }}
      called_workflow_path: .github/workflows/validate-engine.yml
      pull_request_number: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}
      policy_sha256: ${{ needs.prepare.outputs.policy_sha256 }}
      profile_sha256: ${{ needs.prepare.outputs.profile_sha256 }}
      engine_version: ${{ needs.prepare.outputs.version }}
  aggregate:
    name: Verify release inputs
    if: ${{ always() }}
    needs: [prepare, validate]
    uses: ./.github/workflows/verify-release-inputs.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      expected_json: ${{ needs.prepare.outputs.expected_json }}
      policy_json: ${{ needs.prepare.outputs.policy_json }}
      policy_sha256: ${{ needs.prepare.outputs.policy_sha256 }}
      producer_outputs_json: ${{ toJSON(needs.validate.outputs) }}
