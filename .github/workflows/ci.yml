name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  BUILD_TYPE: Debug

jobs:
  # ============================================================
  # Windows MSVC (Debug + Release)
  # ============================================================
  build-windows:
    name: "Windows · MSVC · ${{ matrix.config }}"
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Round 32: the platform-matrix drift gate resolves the evidence
          # HEAD via git log over history; a depth-1 checkout loses the
          # parent diff and would misreport the tip as the evidence HEAD.
          fetch-depth: 0

      - name: Install SDL3 (vcpkg)
        shell: pwsh
        run: |
          # vcpkg's recent bootstrap requires cmake >= 4.3.3, which the
          # hosted runner may lag; install a current cmake via pip first.
          python -m pip install --quiet --upgrade cmake
          $env:Path = "$env:LOCALAPPDATA\Programs\Python\Python312\Scripts;" + $env:Path
          vcpkg install sdl3 --triplet x64-windows

      - name: Configure
        shell: pwsh
        run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_APPLOCAL_DEPS=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Copy SDL3 DLL
        shell: pwsh
        run: |
          $sdlBin = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/x64-windows/bin/SDL3.dll"
          if (Test-Path $sdlBin) { Copy-Item $sdlBin "build/${{ matrix.config }}/" }

      - name: Copy SDL3 DLL for tests
        shell: pwsh
        run: |
          $sdlBin = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/x64-windows/bin/SDL3.dll"
          if (Test-Path $sdlBin) { Copy-Item $sdlBin "build/tests/${{ matrix.config }}/" }

      - name: Static contract check (.ks scenes)
        shell: pwsh
        run: |
          # Next-gen standard gate: every demo scene must pass the
          # declarative command contracts (ks_check.lua) before tests.
          $lua = Get-ChildItem -Recurse build/lua -Filter "lua.exe" | Select-Object -First 1
          if (-not $lua) { $lua = Get-ChildItem -Recurse build -Filter "lua.exe" | Select-Object -First 1 }
          if ($lua) {
            & $lua.FullName scripts/ks_check.lua demo/galgame_demo.ks demo/full_pipeline_demo.ks scripts/demo_story.ks
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "lua.exe not found - skipping static contract check"
          }

      - name: Test coverage check (no orphan tests)
        shell: pwsh
        run: |
          # Regression guard (round 14): every test_*.lua / test_*.cpp must be
          # registered in its runner / CMakeLists — an unregistered test is a
          # silent green. Fails the job listing any orphan.
          python tests/scripts/check_test_coverage.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generated docs freshness
        shell: pwsh
        run: |
          # Round 67: api-stats.md / command-contracts.md must match the
          # current source census — regen and fail on any diff.
          python scripts/api_stats.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $lua = Get-ChildItem -Recurse build/lua -Filter "lua.exe" | Select-Object -First 1
          if (-not $lua) { $lua = Get-ChildItem -Recurse build -Filter "lua.exe" | Select-Object -First 1 }
          if ($lua) {
            python -c "import subprocess, sys; out = subprocess.check_output([sys.argv[1], 'scripts/schema_doc.lua'], encoding='utf-8'); open('docs/api/command-contracts.md', 'w', encoding='utf-8', newline='\n').write(out)" $lua.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git diff --exit-code docs/api/api-stats.md docs/api/command-contracts.md
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Generated docs are stale - run the generators locally and commit"
            exit 1
          }

      - name: Lua script suites (main + orphan)
        shell: pwsh
        run: |
          # Round 60: the full Lua suite never ran in CI (only local).
          # The vendored lua is copied into build/ by the CMake step.
          $lua = Get-ChildItem -Recurse build/lua -Filter "lua.exe" | Select-Object -First 1
          if (-not $lua) { $lua = Get-ChildItem -Recurse build -Filter "lua.exe" | Select-Object -First 1 }
          if ($lua) {
            & $lua.FullName tests/scripts/run_lua_tests.lua
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $lua.FullName tests/scripts/run_orphan_tests.lua
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # Golden Project (release-gate.md §7): ks_check + headless full run.
            & $lua.FullName scripts/ks_check.lua tests/projects/golden_vn/story.ks
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:SAMPLE_STORY = "tests/projects/golden_vn/story.ks"
            & $lua.FullName tests/scripts/sample_game_headless.lua
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "lua.exe not found - skipping Lua suites"
          }

      - name: Web scripts index freshness
        shell: pwsh
        run: |
          # Round 79 guard: deleting scripts/*.lua without regenerating
          # web/scripts-index.json breaks the web suite (ENOENT). Regenerate to
          # a temp file and diff against the committed artifact -- fails red
          # when stale/missing. Lightweight: node only, no wasmoon install.
          node web/gen-index.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Editor unit tests (vitest)
        shell: pwsh
        run: |
          # Editor front-end pure-logic tests (round 16): parseSceneElements
          # and future editor pure functions. node_modules is NOT checked in
          # (gitignored); npm ci installs from the lockfile deterministically.
          Push-Location editor
          npm ci --no-audit --no-fund
          npm test
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { exit $code }

      - name: Web Player unit & integration tests (vitest)
        shell: pwsh
        run: |
          Push-Location web
          npm ci --no-audit --no-fund
          npm test
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { exit $code }

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      - name: Smoke Test
        if: matrix.config == 'Debug'
        shell: pwsh
        run: |
          $exe = "build/${{ matrix.config }}/CaesuraAmeKAG.exe"
          if (Test-Path $exe) { Write-Host "Engine OK: $((Get-Item $exe).Length/1MB) MB" }

      - name: Web Packaging Unicode E2E
        if: matrix.config == 'Debug'
        shell: pwsh
        run: |
          # Round 32 (Track A): real engine + POST /api/package/web with a
          # Chinese story path and output name - CreateProcessW / widenUtf8
          # path-safety gate (tests/scripts/test_package_web_unicode.py).
          python tests/scripts/test_package_web_unicode.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/scripts/test_package_game_node_cli.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ============================================================
  # macOS Clang
  # ============================================================
  build-macos:
    name: "macOS · Clang"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Round 32: the platform-matrix drift gate resolves the evidence
          # HEAD via git log over history; a depth-1 checkout loses the
          # parent diff and would misreport the tip as the evidence HEAD.
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          brew install cmake sdl3 freetype zstd openssl@3 pkg-config lua
          python3 -m pip install --quiet pyyaml --break-system-packages 2>/dev/null || true

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DCAESURA_ENABLE_FFMPEG=OFF -DBX_CONFIG_DEBUG=1 -DCMAKE_PREFIX_PATH="$(brew --prefix openssl@3)"

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Debug --parallel $(sysctl -n hw.logicalcpu) > build.log 2>&1 || { echo '=== build errors ==='; grep -iE 'error:|fatal error|undefined' build.log | head -30; tail -40 build.log; exit 1; }

      - name: Lua script suites (main + orphan)
        run: |
          lua tests/scripts/run_lua_tests.lua
          lua tests/scripts/run_orphan_tests.lua
          # Golden Project (release-gate.md §7): ks_check + headless full run.
          lua scripts/ks_check.lua tests/projects/golden_vn/story.ks
          SAMPLE_STORY="tests/projects/golden_vn/story.ks" lua tests/scripts/sample_game_headless.lua

      - name: Web scripts index freshness
        run: |
          # Round 79 guard: deleting scripts/*.lua without regenerating
          # web/scripts-index.json breaks the web suite (ENOENT). Regenerate to
          # a temp file and diff against the committed artifact -- fails red
          # when stale/missing. Lightweight: node only, no wasmoon install.
          node web/gen-index.mjs --check

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ============================================================
  # Linux GCC
  # ============================================================
  build-linux:
    name: "Linux · GCC"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Round 32: the platform-matrix drift gate resolves the evidence
          # HEAD via git log over history; a depth-1 checkout loses the
          # parent diff and would misreport the tip as the evidence HEAD.
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential lua5.4 libfreetype-dev libzstd-dev libssl-dev libx11-dev libxrandr-dev libxext-dev libxfixes-dev libxi-dev libxcursor-dev libxinerama-dev libpulse-dev libasound2-dev libwayland-dev libdrm-dev libgbm-dev libibus-1.0-dev libudev-dev pkg-config wget python3-yaml

      - name: Configure ALSA null device (headless audio)
        run: |
          # SoLoud ALSA backend (enabled on Linux) needs a default PCM; CI
          # runners have no sound card. A null device lets init succeed and
          # keeps the audio path exercised instead of SIGABRT on snd_pcm.
          printf "pcm.!default { type null }\nctl.!default { type null }\n" | sudo tee /etc/asound.conf

      - name: Build SDL3 from source
        run: |
          wget -q https://github.com/libsdl-org/SDL/releases/download/release-3.2.0/SDL3-3.2.0.tar.gz
          tar xzf SDL3-3.2.0.tar.gz
          cd SDL3-3.2.0
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build build --parallel $(nproc)
          sudo cmake --install build
          sudo ldconfig
          cd ..
          rm -rf SDL3-3.2.0 SDL3-3.2.0.tar.gz

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DCAESURA_ENABLE_FFMPEG=OFF -DBX_CONFIG_DEBUG=1 -DCAESURA_REQUIRE_TEST_PREREQUISITES=ON

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Debug --parallel $(nproc) > build.log 2>&1 || { echo '=== build errors ==='; grep -iE 'error:|fatal error|undefined' build.log | head -30; tail -40 build.log; exit 1; }
          tail -3 build.log

      - name: Bundled layout boot smoke (xvfb; A3/R6 contract)
        run: |
          sudo apt-get install -y xvfb libgl1 libegl1 libglx-mesa0 libgl1-mesa-dri
          xvfb-run -a -s "-screen 0 1280x720x24" bash scripts/verify_bundle_boot.sh build/CaesuraAmeKAG first_vn
          xvfb-run -a -s "-screen 0 1280x720x24" bash scripts/verify_bundle_boot.sh build/CaesuraAmeKAG demo

      - name: Lua script suites (main + orphan)
        run: |
          lua5.4 tests/scripts/run_lua_tests.lua
          lua5.4 tests/scripts/run_orphan_tests.lua
          # Golden Project (release-gate.md §7): ks_check + headless full run.
          lua5.4 scripts/ks_check.lua tests/projects/golden_vn/story.ks
          SAMPLE_STORY="tests/projects/golden_vn/story.ks" lua5.4 tests/scripts/sample_game_headless.lua

      - name: Web scripts index freshness
        run: |
          # Round 79 guard: deleting scripts/*.lua without regenerating
          # web/scripts-index.json breaks the web suite (ENOENT). Regenerate to
          # a temp file and diff against the committed artifact -- fails red
          # when stale/missing. Lightweight: node only, no wasmoon install.
          node web/gen-index.mjs --check

      - name: Web package hard gate (t144 design A)
        run: |
          # Bare checkout: cache/, web/dist/ and dist/ are all gitignored. Bake the
          # demo bundle first (web/vite.config.js closeBundle copies cache/story
          # unconditionally and ENOENTs without it), build the player, package
          # first_vn against it and assert the packaged tree. web/dist now exists,
          # so resources.test.js's dist cases run for real in the vitest step.
          lua5.4 scripts/ks_bake.lua --dir demo --web cache/story
          (cd web && npm ci --no-audit --no-fund && npm run build)
          bash scripts/package_game.sh --no-web-build tests/projects/first_vn
          bash scripts/verify_web_package.sh dist/first_vn
          python3 tests/scripts/test_package_game_node_cli.py

      - name: Web package real-browser boot smoke (t199 A gate)
        run: |
          # Headless Chrome boots the packaged dist/ first_vn and asserts the
          # web player (12 checks incl. boot/text; --unlock for Chrome
          # autoplay-gesture). CHROME_BIN drives the runner's preinstalled
          # chrome; falls back to the portable CHROME_PATHS table.
          # Retry once: headless Chrome CDP startup is intermittently flaky
          # on hosted runners (CDP endpoint absent, no chrome error -- a
          # spawn-side race, not a package/assertion regression). A second
          # run exercises the same checks; a real break still fails the gate.
          for attempt in 1 2; do
            echo "=== web-smoke attempt $attempt ==="
            if node scripts/web_browser_smoke.mjs --root dist/first_vn --unlock; then
              echo "web-smoke attempt $attempt PASSED"
              exit 0
            fi
            echo "web-smoke attempt $attempt failed; retrying"
          done
          exit 1

      - name: Web Player unit & integration tests (vitest)
        run: |
          cd web
          npm test
          cd ..

      - name: Test
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ctest --test-dir build --output-on-failure 2>&1 | tee ctest.log
          exit ${PIPESTATUS[0]}

      - name: Upload ctest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-ctest-log
          path: ctest.log
          if-no-files-found: ignore

      - name: Coupling Count
        run: python3 scripts/count_coupling.py --ci

      - name: Test Coverage Check
        run: python3 tests/scripts/check_test_coverage.py

      - name: Platform Matrix Freshness & Validation
        run: python3 scripts/generate_platform_status.py --check

      - name: Platform Matrix Generator Unit Tests
        run: python3 tests/scripts/test_generate_platform_status.py

      - name: Plan Status Fact-Sync Check
        run: python3 scripts/generate_plan_status.py --check

      - name: Capability Closure Matrix Freshness
        run: |
          # Round 32 (Track B): closure matrix must match the current source
          # census. generated_at embeds the newest-input mtime by design, so
          # it differs across checkouts - normalize that line out of the diff
          # (git diff -I ignores hunks whose changed lines all match).
          python3 scripts/capability_closure.py
          if ! git diff -I "> 生成时间" --exit-code -- docs/design/capability-closure-matrix.md; then
            echo "Capability closure matrix is stale - run scripts/capability_closure.py and commit"
            exit 1
          fi

      - name: Android Subsystem Regression Gate
        run: python3 scripts/verify_android_regression.py

      - name: Native validation evidence (not release approval)
        run: |
          RAW="$RUNNER_TEMP/caesura-native-validation"
          xvfb-run -a -s "-screen 0 1280x720x24" python3 scripts/run_validation.py --profile-name linux-debug \
            --build-dir build --configuration Debug --run-dir "$RAW" || execution_failed=1
          python3 - "$RAW" <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          raw = Path(sys.argv[1])
          receipt = raw / 'run.json'
          run = json.loads(receipt.read_text(encoding='utf-8'))
          output = Path('artifacts/validation') / run['source_sha'] / run['run_id'] / 'linux-debug'
          common = ['--profile', 'scripts/validation_profiles.json', '--profile-name', 'linux-debug']
          subprocess.run([sys.executable, 'scripts/collect_validation_evidence.py', *common,
                          '--run', str(receipt), '--output', str(output)], check=True)
          # Earlier documentation probes may leave generated-file changes. This
          # validates actual profile results, never grants release permission.
          subprocess.run([sys.executable, 'scripts/verify_release_candidate.py', *common,
                          '--artifacts-dir', str(output), '--expected-run', str(receipt),
                          '--commit', run['source_sha'], '--diagnostic', '--check'], check=True)
          PY
          test "${execution_failed:-0}" = 0

      - name: Upload native validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-validation-linux-debug
          path: |
            ${{ runner.temp }}/caesura-native-validation/
            artifacts/validation/
          if-no-files-found: warn

  # ============================================================
  # Release Package (Windows only)
  # ============================================================
  release:
    name: "Release · Package"
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    needs: build-windows
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Round 32: the platform-matrix drift gate resolves the evidence
          # HEAD via git log over history; a depth-1 checkout loses the
          # parent diff and would misreport the tip as the evidence HEAD.
          fetch-depth: 0

      - name: Install SDL3 (vcpkg)
        shell: pwsh
        run: |
          # vcpkg's recent bootstrap requires cmake >= 4.3.3, which the
          # hosted runner may lag; install a current cmake via pip first.
          python -m pip install --quiet --upgrade cmake
          $env:Path = "$env:LOCALAPPDATA\Programs\Python\Python312\Scripts;" + $env:Path
          vcpkg install sdl3 --triplet x64-windows

      - name: Configure Release
        shell: pwsh
        run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_APPLOCAL_DEPS=OFF

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Build editor IDE (editor/dist ships in the package)
        shell: pwsh
        run: |
          cd editor
          npm ci --no-audit --no-fund
          npm run build

      - name: Package (CPack)
        shell: pwsh
        run: cd build; cpack -C Release -G ZIP

      - name: Collect Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts
          $zip = Get-ChildItem -Filter "*.zip" -Path build | Select-Object -First 1
          if ($zip) { Copy-Item $zip.FullName release-artifacts/ }
          Copy-Item build/Release/CaesuraAmeKAG.exe release-artifacts/ -ErrorAction SilentlyContinue
          Copy-Item build/Release/SDL3.dll release-artifacts/ -ErrorAction SilentlyContinue

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caesura-amekag-windows-x64
          path: release-artifacts/

  # ============================================================
  # Release Package (Linux TGZ) -- Sprint6-L1. Same gate semantics as the
  # Windows release job: master/tags only, needs the Linux test job green.
  # The TGZ carries libSDL3.so.0 beside the executable ($ORIGIN RPATH); the
  # 29-assertion verifier runs against the packed artifact under Xvfb.
  # ============================================================
  release-linux:
    name: "Linux · Package"
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Round 32: the platform-matrix drift gate resolves the evidence
          # HEAD via git log over history; a depth-1 checkout loses the
          # parent diff and would misreport the tip as the evidence HEAD.
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential lua5.4 libfreetype-dev libzstd-dev libssl-dev libx11-dev libxrandr-dev libxext-dev libxfixes-dev libxi-dev libxcursor-dev libxinerama-dev libpulse-dev libasound2-dev libwayland-dev libdrm-dev libgbm-dev libibus-1.0-dev libudev-dev pkg-config wget python3-yaml xvfb libgl1 libegl1 libglx-mesa0 libgl1-mesa-dri

      - name: Configure ALSA null device (headless audio)
        run: |
          printf "pcm.!default { type null }\nctl.!default { type null }\n" | sudo tee /etc/asound.conf

      - name: Build SDL3 from source
        run: |
          wget -q https://github.com/libsdl-org/SDL/releases/download/release-3.2.0/SDL3-3.2.0.tar.gz
          tar xzf SDL3-3.2.0.tar.gz
          cd SDL3-3.2.0
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build build --parallel $(nproc)
          sudo cmake --install build
          sudo ldconfig
          cd ..
          rm -rf SDL3-3.2.0 SDL3-3.2.0.tar.gz

      - name: Configure Release
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCAESURA_ENABLE_FFMPEG=OFF

      - name: Build Release
        run: |
          set -o pipefail
          cmake --build build --parallel $(nproc) > build.log 2>&1 || { echo '=== build errors ==='; grep -iE 'error:|fatal error|undefined' build.log | head -30; tail -40 build.log; exit 1; }
          tail -3 build.log

      - name: Build editor IDE (editor/dist ships in the package)
        run: |
          cd editor
          npm ci --no-audit --no-fund
          npm run build

      - name: Package (CPack TGZ)
        run: cd build && cpack -G TGZ

      - name: Build AppImage (release lane; t210 script, CI wiring)
        run: |
          set -euo pipefail
          appimagetool=build/appimagetool-x86_64
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O "$appimagetool"
          chmod +x "$appimagetool"
          TGZ=$(ls build/CaesuraAmeKAG-*-Linux-*.tar.gz | head -1)
          echo "appimage from: $TGZ"
          APPIMAGETOOL="$PWD/$appimagetool" bash scripts/build_appimage.sh --tgz "$TGZ"
          APP=$(ls build/CaesuraAmeKAG-*-Linux-*.AppImage | head -1)
          test -f "$APP" || { echo "AppImage not produced"; exit 1; }
          ls -la "$APP" build/CaesuraAmeKAG-*-Linux-*.sha256

      - name: Verify release package (32 assertions, serial)
        run: |
          TGZ=$(ls build/CaesuraAmeKAG-*-Linux-*.tar.gz | head -1)
          echo "verifying: $TGZ"
          xvfb-run -a -s "-screen 0 1280x720x24" bash scripts/verify_release_package.sh "$TGZ"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caesura-amekag-linux-x64
          path: |
            build/CaesuraAmeKAG-*-Linux-*.tar.gz
            build/CaesuraAmeKAG-*-Linux-*.tar.gz.sha256
            build/CaesuraAmeKAG-*-Linux-*.AppImage
            build/CaesuraAmeKAG-*-Linux-*.sha256
            build/CaesuraAmeKAG-*-Linux-*.AppImage
            build/CaesuraAmeKAG-*-Linux-*.sha256

  # ============================================================
  # Release Package (macOS TGZ) -- Sprint6-L2, mirrors release-linux.
  # The verify step is a HARD GATE (round-9+). Round-7's red was a
  # verify-script false positive: ps -args returned empty for a live,
  # serving engine on this runner, so a live process was judged dead.
  # Fixed by launcher-recorded pid/rc files (0422c17c, sections 3-4);
  # the fixed script then ran 30/30 green as a probe on round-8
  # (run 33248475888; editor ready in 3s, token in 1s -- 45s cap ok).
  # Headless --editor is PROVEN to serve on macos-latest.
  # ============================================================
  release-macos:
    name: "macOS · Package"
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    timeout-minutes: 40
    needs: build-macos
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Round 32: the platform-matrix drift gate resolves the evidence
          # HEAD via git log over history; a depth-1 checkout loses the
          # parent diff and would misreport the tip as the evidence HEAD.
          fetch-depth: 0

      - name: Install Dependencies
        run: brew install cmake freetype zstd openssl@3 pkg-config

      # DIFF vs release-linux: SDL3 goes to RUNNER_TEMP (not brew, whose
      # dylib carries an absolute install_name; the source build ids as
      # @rpath/... which @loader_path resolves beside the executable).
      - name: Build SDL3 from source
        run: |
          curl -fsSL -o SDL3-3.2.0.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-3.2.0/SDL3-3.2.0.tar.gz
          tar xzf SDL3-3.2.0.tar.gz
          cd SDL3-3.2.0
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3-mac"
          cmake --build build --parallel $(sysctl -n hw.logicalcpu)
          cmake --install build
          cd ..
          rm -rf SDL3-3.2.0 SDL3-3.2.0.tar.gz

      - name: Configure Release
        env:
          SDL3_DIR: ${{ runner.temp }}/sdl3-mac/lib/cmake/SDL3
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCAESURA_ENABLE_FFMPEG=OFF -DCMAKE_PREFIX_PATH="$(brew --prefix openssl@3)"

      - name: Build Release
        run: |
          set -o pipefail
          cmake --build build --parallel $(sysctl -n hw.logicalcpu) > build.log 2>&1 || { echo '=== build errors ==='; grep -iE 'error:|fatal error|undefined' build.log | head -30; tail -40 build.log; exit 1; }
          tail -3 build.log

      - name: SDL3 link evidence (otool)
        run: otool -L build/CaesuraAmeKAG | grep -i sdl3 || true

      - name: Build editor IDE (editor/dist ships in the package)
        run: |
          cd editor
          npm ci --no-audit --no-fund
          npm run build

      - name: Package (CPack TGZ)
        run: cd build && cpack -G TGZ

      - name: Verify release package (32 assertions, hard gate)
        timeout-minutes: 20
        run: |
          TGZ=$(ls build/CaesuraAmeKAG-*-Darwin-*.tar.gz | head -1)
          echo "verifying: $TGZ"
          bash scripts/verify_release_package.sh "$TGZ"

      # 035 D4: DMG is the macOS storefront artifact. CPack's DMG generator
      # bundles the same install tree as the TGZ (hdiutil, runner-native);
      # signing/notarization stay account-gated (ad-hoc unsigned DMG today).
      - name: Package (CPack DMG)
        # CPack's macOS disk-image generator is named DragNDrop (the "DMG"
        # alias is not registered on every CMake version -- observed 3.25+).
        run: cd build && cpack -G DragNDrop

      - name: Verify DMG exists and mounts/contains the payload
        run: |
          set -e
          DMG=$(ls build/CaesuraAmeKAG-*-Darwin-*.dmg | head -1)
          test -n "$DMG" && test -s "$DMG" || { echo "no DMG produced"; exit 1; }
          echo "dmg: $DMG ($(du -h "$DMG" | cut -f1))"
          # Mount read-only and confirm the payload: bare executable (the
          # macOS build is NOT a .app bundle -- MACOSX_BUNDLE is iOS-only in
          # CMakeLists; the DMG is a bare-dir layout mirroring the TGZ) plus
          # the payload dirs (scripts/demo/assets) inside the image.
          MNT=$(mktemp -d /tmp/caesura-dmg.XXXXXX)
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" "$DMG" >/dev/null
          test -x "$MNT/CaesuraAmeKAG" || { echo "no bare executable in DMG"; hdiutil detach "$MNT" >/dev/null || true; exit 1; }
          echo "exe: $MNT/CaesuraAmeKAG"
          test -d "$MNT/scripts"
          test -d "$MNT/demo"
          test -d "$MNT/assets"
          hdiutil detach "$MNT" >/dev/null

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caesura-amekag-macos-arm64
          path: |
            build/CaesuraAmeKAG-*-Darwin-*.tar.gz
            build/CaesuraAmeKAG-*-Darwin-*.tar.gz.sha256
            build/CaesuraAmeKAG-*-Darwin-*.dmg

  # ============================================================
  # iOS compile (Track I I1) - HARD GATE since 2026-09-04 (035 D batch).
  # The toolchain gaps closed over the red-green probe cycles (SDL3/OpenSSL
  # iOS slices, CMake iOS branch, LUA_USE_IOS, BUNDLE DESTINATION,
  # Metal shader arrays) now build green on every run -- the probe is
  # promoted to a blocking gate so a regression fails the branch loudly.
  # ============================================================
  ios-compile:
    name: "iOS CMake probe (gate)"
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Round 32: the platform-matrix drift gate resolves the evidence
          # HEAD via git log over history; a depth-1 checkout loses the
          # parent diff and would misreport the tip as the evidence HEAD.
          fetch-depth: 0

      - name: "Cache SDL3 iOS prebuilt slice"
        id: cache-sdl3-ios
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdl3-ios
          key: sdl3-ios-release-3.2.4-${{ runner.os }}

      - name: "Build SDL3 source for iOS (move the red past the package gate)"
        if: steps.cache-sdl3-ios.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          SDL_SRC="$RUNNER_TEMP/sdl-src"
          SDL_INSTALL="$RUNNER_TEMP/sdl3-ios"
          git clone --depth 1 --branch release-3.2.4 https://github.com/libsdl-org/SDL.git "$SDL_SRC"
          cmake -S "$SDL_SRC" -B "$SDL_SRC/build-ios" \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_STATIC=ON -DSDL_SHARED=ON \
            -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF -DSDL_DOCS=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_INSTALL_PREFIX="$SDL_INSTALL"
          cmake --build "$SDL_SRC/build-ios" --config Release --parallel 3 \
            -- CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          cmake --install "$SDL_SRC/build-ios" --config Release

      - name: "Set SDL3 environment"
        shell: bash
        run: |
          echo "SDL3_DIR=$RUNNER_TEMP/sdl3-ios/lib/cmake/SDL3" >> "$GITHUB_ENV"

      - name: "Cache OpenSSL iOS prebuilt slice"
        id: cache-openssl-ios
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/openssl-ios
          key: openssl-ios-3.3.2-${{ runner.os }}

      - name: "Build OpenSSL source for iOS (archive crypto dep)"
        if: steps.cache-openssl-ios.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          OSSL_SRC="$RUNNER_TEMP/openssl-src"
          OSSL_INSTALL="$RUNNER_TEMP/openssl-ios"
          mkdir -p "$OSSL_SRC"
          curl -sL https://github.com/openssl/openssl/releases/download/openssl-3.3.2/openssl-3.3.2.tar.gz -o "$RUNNER_TEMP/openssl.tgz"
          tar -xzf "$RUNNER_TEMP/openssl.tgz" -C "$OSSL_SRC"
          cd "$OSSL_SRC/openssl-3.3.2"
          export IPHONE_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CC="$(xcrun -sdk iphoneos -f clang) -isysroot $IPHONE_SDK"
          export CROSS_TOP="$(xcrun --sdk iphoneos --show-sdk-platform-path)"
          export CROSS_SDK="iPhoneOS.sdk"
          perl Configure ios64-xcrun --prefix="$OSSL_INSTALL" no-shared no-tests no-apps no-docs
          make -j3
          make install_sw

      - name: "Set OpenSSL environment"
        shell: bash
        run: |
          echo "OPENSSL_ROOT_DIR=$RUNNER_TEMP/openssl-ios" >> "$GITHUB_ENV"

      - name: "Verify Metal Shaders & Fallback paths"
        shell: bash
        run: |
          python3 scripts/verify_metal_shaders.py

      - name: "Configure iOS (red point moves to engine-side gaps)"
        shell: bash
        run: |
          export PKG_CONFIG_PATH="$RUNNER_TEMP/openssl-ios/lib/pkgconfig"
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCAESURA_LIVE2D=OFF \
            -DCAESURA_ENABLE_FFMPEG=OFF \
            -DSDL3_DIR="$RUNNER_TEMP/sdl3-ios/lib/cmake/SDL3" \
            -DOPENSSL_ROOT_DIR="$RUNNER_TEMP/openssl-ios" \
            -DCMAKE_XCODE_ATTRIBUTE_PRODUCT_BUNDLE_IDENTIFIER=com.caesura.amekag

      - name: Build module graph
        shell: bash
        run: |
          cmake --build build-ios --config Release --parallel 3 \
            -- CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Toolchain state summary
        if: always()
        shell: bash
        run: |
          echo "ios-compile probe finished (see above for the gap list)"

  # ============================================================
  # Android static audit (Track M) — zero-NDK checks the mobile pipeline
  # can run everywhere; native cross-compile stays --smoke on a dev box
  # with an NDK (documented in docs/guides/android-build.md §5).
  # ============================================================
  android-static:
    name: "Android static contract (no NDK)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Round 32: the platform-matrix drift gate resolves the evidence
          # HEAD via git log over history; a depth-1 checkout loses the
          # parent diff and would misreport the tip as the evidence HEAD.
          fetch-depth: 0

      - name: Script syntax + friendly diagnostics
        shell: bash
        run: |
          bash -n scripts/build_android.sh
          # GH ubuntu runners preinstall an Android NDK/SDK, so the script
          # may reach past the NDK gate; BOTH diagnostics are legitimate:
          # no NDK -> clean exit-1 message, NDK present -> SDL3_DIR error.
          out=$(bash scripts/build_android.sh 2>&1 || true)
          echo "$out" | grep -qE "Android NDK not found|SDL3_DIR not set or invalid" || {
            echo "expected a proper diagnostic; got:"; echo "$out"; exit 1; }

      - name: .ks contract gate for the Android demo content
        shell: bash
        run: |
          lua=external/lua/lua.exe
          if [ -x "$lua" ]; then :; else lua=$(command -v lua || true); fi
          if [ -n "$lua" ]; then "$lua" scripts/ks_check.lua tests/projects/first_vn/story.ks; fi

  # ============================================================
  # Android CMake probe (Track M A1) — GH ubuntu runners ship an
  # NDK, so the red-green loop can run on CI like the iOS probe.
  # continue-on-error keeps the branch green while the probe
  # surfaces the R9/R1 gaps in the workflow log.
  # ============================================================
  android-compile:
    name: "Android CMake probe (audit)"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Round 32: the platform-matrix drift gate resolves the evidence
          # HEAD via git log over history; a depth-1 checkout loses the
          # parent diff and would misreport the tip as the evidence HEAD.
          fetch-depth: 0

      - name: "Build SDL3 Android slice (arm64-v8a)"
        shell: bash
        run: |
          set -e
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          if [ -z "$NDK" ]; then NDK=$(ls -d "${ANDROID_SDK_ROOT:-}/ndk/"* 2>/dev/null | head -1); fi
          echo "NDK=$NDK"
          test -n "$NDK" || { echo "no NDK on runner"; exit 1; }
          echo "NDK_DIR=$NDK" >> "$GITHUB_ENV"
          git clone --depth 1 --branch release-3.2.4 https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/sdl-src"
          cmake -S "$RUNNER_TEMP/sdl-src" -B "$RUNNER_TEMP/sdl-build" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release -DSDL_STATIC=ON -DSDL_SHARED=ON \
            -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF -DSDL_DOCS=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3-android"
          cmake --build "$RUNNER_TEMP/sdl-build" --parallel 3
          cmake --install "$RUNNER_TEMP/sdl-build"
          echo "SDL3_DIR=$RUNNER_TEMP/sdl3-android/lib/cmake/SDL3" >> "$GITHUB_ENV"

      - name: "Build OpenSSL Android slice (arm64-v8a, api 24)"
        shell: bash
        run: |
          set -e
          git clone --depth 1 --branch openssl-3.3.2 https://github.com/openssl/openssl.git "$RUNNER_TEMP/openssl-src"
          cd "$RUNNER_TEMP/openssl-src"
          export ANDROID_NDK_ROOT="$NDK_DIR"
          export PATH="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          ./Configure android-arm64 --prefix="$RUNNER_TEMP/openssl-android" -D__ANDROID_API__=24
          make -j3
          make install_sw
          echo "OPENSSL_ROOT_DIR=$RUNNER_TEMP/openssl-android" >> "$GITHUB_ENV"

      - name: "Configure Android (red point moves to engine-side gaps)"
        shell: bash
        run: |
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCAESURA_LIVE2D=OFF -DCAESURA_ENABLE_FFMPEG=OFF \
            -DSOLOUD_BACKEND_OPENSLES=ON \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" \
            -DSDL3_DIR="$SDL3_DIR"

      - name: "Build module graph"
        shell: bash
        run: |
          cmake --build build-android --parallel 3
          ls -la build-android/libCaesuraAmeKAG.so

      - name: "Stage native libs for the APK (A2 host)"
        shell: bash
        run: |
          set -e
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp build-android/libCaesuraAmeKAG.so android/app/src/main/jniLibs/arm64-v8a/
          cp "$RUNNER_TEMP/sdl3-android/lib/libSDL3.so" android/app/src/main/jniLibs/arm64-v8a/
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      - name: "Stage game bundle (A3 + R6 read glue contract)"
        shell: bash
        run: |
          set -e
          # Canonical engine resource root (same contract as demo/):
          #   <root>/scripts  (runtime; config.lua entry_script -> game entry)
          #   <root>/assets   (shared media pool)
          #   <root>/demo/<project>/ (entry.lua + story.ks + assets/)
          # MainActivity extracts APK assets/game/** into internal storage
          # once, then forwards --resource-root <root> to SDL_main argv.
          rm -rf android/app/src/main/assets/game
          mkdir -p android/app/src/main/assets/game/demo
          cp -r scripts  android/app/src/main/assets/game/scripts
          cp -r assets   android/app/src/main/assets/game/assets
          cp -r tests/projects/first_vn android/app/src/main/assets/game/demo/first_vn
          sed -i 's|config.entry_script = .*|config.entry_script = "../demo/first_vn/entry.lua"  -- A3/R6: first_vn entry (engine resolves scripts/../demo/first_vn)|' \
            android/app/src/main/assets/game/scripts/config.lua
          grep -n "entry_script" android/app/src/main/assets/game/scripts/config.lua

      - name: "Generate ephemeral test keystore (Track A5)"
        shell: bash
        run: |
          set -e
          bash scripts/generate_android_keystore.sh --test --keystore "$RUNNER_TEMP/ci-release.keystore"
          echo "CAESURA_ANDROID_KEYSTORE=$RUNNER_TEMP/ci-release.keystore" >> "$GITHUB_ENV"
          echo "CAESURA_ANDROID_KEYSTORE_PASS=caesura_test_pass" >> "$GITHUB_ENV"
          echo "CAESURA_ANDROID_KEY_ALIAS=caesura-test" >> "$GITHUB_ENV"
          echo "CAESURA_ANDROID_KEY_PASS=caesura_test_pass" >> "$GITHUB_ENV"

      - name: "Gradle assembleDebug, assembleRelease & bundleRelease (Track A5)"
        shell: bash
        run: |
          set -e
          # Hosted ubuntu images ship the Android SDK; compileSdk 35 may be
          # missing → install defensively (licenses are pre-accepted).
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" >/dev/null 2>&1 || true
          GRADLE="gradle"
          if gradle --version 2>/dev/null | grep -q "Gradle 8.9\|Gradle 8.10\|Gradle 8.1[1-9]"; then
            echo "using runner gradle"
          else
            echo "runner gradle too old/missing - downloading 8.9"
            curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            GRADLE="/tmp/gradle-8.9/bin/gradle"
          fi
          cd android
          echo "=== Building assembleDebug ==="
          "$GRADLE" --no-daemon --console=plain assembleDebug
          echo "=== Building assembleRelease (Signed with ephemeral key) ==="
          "$GRADLE" --no-daemon --console=plain assembleRelease
          echo "=== Building bundleRelease (AAB for Play Store) ==="
          "$GRADLE" --no-daemon --console=plain bundleRelease
          cd ..

      - name: "Verify Android release artifacts (zipalign & apksigner) (Track A5)"
        shell: bash
        run: |
          set -e
          echo "=== Locating Android Build Tools ==="
          BT_DIR=$(ls -d "$ANDROID_SDK_ROOT/build-tools/"* 2>/dev/null | sort -V | tail -n 1)
          echo "Build tools: $BT_DIR"
          ZIPALIGN="$BT_DIR/zipalign"
          APKSIGNER="$BT_DIR/apksigner"

          echo "=== 1. APK Alignment Verification (zipalign -c) ==="
          "$ZIPALIGN" -c -v 4 android/app/build/outputs/apk/release/app-release.apk

          echo "=== 2. APK Signature Verification (apksigner verify) ==="
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

          echo "=== 3. APK Content Check ==="
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -E "assets/game/demo/first_vn/story.ks|assets/game/demo/first_vn/entry.lua|assets/game/scripts/kag/init.lua|assets/game/assets/lang/|libCaesuraAmeKAG.so|libSDL3.so"

          echo "=== 4. AAB Content & Structure Check ==="
          test -f android/app/build/outputs/bundle/release/app-release.aab
          unzip -l android/app/build/outputs/bundle/release/app-release.aab | grep -E "base/lib/arm64-v8a/libCaesuraAmeKAG.so|base/lib/arm64-v8a/libSDL3.so|base/assets/game/scripts/kag/init.lua|base/manifest/AndroidManifest.xml"

      - name: "Upload android slices for local builds (device day)"
        uses: actions/upload-artifact@v4
        with:
          name: android-slices
          path: |
            $RUNNER_TEMP/sdl3-android/
            $RUNNER_TEMP/openssl-android/
          if-no-files-found: warn

      - name: "Upload APK & AAB artifacts (device day)"
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release*.apk
            android/app/build/outputs/bundle/release/app-release*.aab
          if-no-files-found: warn
