name: Deploy Web Player (GitHub Pages)

on:
  workflow_dispatch:
    inputs:
      game:
        description: 'Source game directory or .ks file to package; only this game story bundle ships'
        required: false
        default: demo/galgame_demo.ks
        type: string
      actions:
        description: 'Optional repository-relative UI actions JSON for reaching a save point'
        required: false
        type: string
      actions_sha256:
        description: 'Required SHA256 when actions is supplied; locked before browser execution'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Validate the chosen final Web package and deploy Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Select a new package work path outside the checkout
        run: echo "PACKAGE_WORK=$RUNNER_TEMP/caesura-pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies and Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          npm ci --prefix web --no-audit --no-fund
      - name: Require current tracked script index
        run: node web/gen-index.mjs --check
      - name: Build explicit game and validate root, subpath and offline reload
        id: package
        env:
          GAME_INPUT: ${{ inputs.game }}
          ACTIONS_INPUT: ${{ inputs.actions }}
          ACTIONS_SHA256: ${{ inputs.actions_sha256 }}
        run: |
          args=()
          if [ -n "$ACTIONS_INPUT" ] || [ -n "$ACTIONS_SHA256" ]; then
            args=(--actions "$ACTIONS_INPUT" --actions-sha256 "$ACTIONS_SHA256")
          fi
          python3 scripts/ci_package_lane.py web --source-sha "$SOURCE_SHA" --work "$PACKAGE_WORK" \
            --game "$GAME_INPUT" --node "$(command -v node)" --lua "$(command -v lua5.4)" \
            --browser /opt/google/chrome/chrome "${args[@]}" --github-output "$GITHUB_OUTPUT"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Recheck accepted directory immediately before upload
        env:
          RECEIPT: ${{ steps.package.outputs.receipt }}
          RECEIPT_SHA256: ${{ steps.package.outputs.receipt_sha256 }}
        run: python3 scripts/ci_package_lane.py verify --receipt "$RECEIPT" --sha256 "$RECEIPT_SHA256"
      - name: Upload exact accepted Pages directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.package.outputs.site }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Preserve first package attempt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-final-package-evidence
          path: |
            ${{ env.PACKAGE_WORK }}/**/*.json
            ${{ env.PACKAGE_WORK }}/**/*.log
            ${{ env.PACKAGE_WORK }}/**/*.png
          if-no-files-found: warn
